apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-coordinator
  labels:
    app: kore-coordinator
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.coordinator.replicas }}
  selector:
    matchLabels:
      app: kore-coordinator
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: kore-coordinator
        release: {{ .Release.Name }}
    spec:
      containers:
        - name: kore-coordinator
          image: "{{ .Values.coordinator.image.repository }}:{{ .Values.coordinator.image.tag }}"
          imagePullPolicy: {{ .Values.coordinator.image.pullPolicy }}
          command: ["kore-coord"]
          args:
            - "--bind"
            - "0.0.0.0:{{ .Values.coordinator.service.port }}"
          ports:
            - name: coord
              containerPort: {{ .Values.coordinator.service.port }}
              protocol: TCP
          resources:
            {{- toYaml .Values.coordinator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-coordinator
  labels:
    app: kore-coordinator
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.coordinator.service.type }}
  ports:
    - port: {{ .Values.coordinator.service.port }}
      targetPort: coord
      protocol: TCP
      name: coord
  selector:
    app: kore-coordinator
    release: {{ .Release.Name }}
