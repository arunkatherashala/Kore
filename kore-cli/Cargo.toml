[package]
name = "kore-cli"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Command-line interface for Kore file format inspection, validation, conversion, and analysis"
authors = ["Arun Kather Ashala <arun@kore.dev>"]
license = "KUOPL"
repository = "https://github.com/arunkatherashala/Kore"

[[bin]]
name = "kore"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
clap = { version = "4.4", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
bytes = "1.5"
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
parking_lot = "0.12"
dashmap = "5.5"
sha2 = "0.10"
blake3 = "1.5"
flate2 = "1.0"
zstd = "0.13"
arrow = "58.3"
arrow-json = "58.3"
comfy-table = "7.0"
indicatif = "0.17"
regex = "1.10"
walkdir = "2.4"

[dev-dependencies]
tempfile = "3.8"

[features]
default = []
all = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
