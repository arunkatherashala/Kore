<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KORE Viewer — Drop .hkore to view</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:#0d1117;color:#c9d1d9;min-height:100vh}
.header{background:#161b22;padding:16px 24px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:16px}
.header h1{color:#58a6ff;font-size:1.4em}
.drop-zone{border:2px dashed #30363d;border-radius:12px;padding:60px;text-align:center;margin:40px auto;max-width:800px;cursor:pointer;transition:all .2s}
.drop-zone:hover,.drop-zone.active{border-color:#58a6ff;background:#161b22}
.drop-zone h2{color:#58a6ff;margin-bottom:10px}
.drop-zone p{color:#8b949e}
#output{max-width:1200px;margin:20px auto;padding:0 20px;display:none}
.meta{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-bottom:20px;font-family:monospace;white-space:pre-wrap;color:#8b949e;font-size:0.9em}
table{width:100%;border-collapse:collapse}
th{background:#161b22;color:#58a6ff;padding:10px;text-align:left;border:1px solid #30363d;position:sticky;top:0}
td{padding:8px 10px;border:1px solid #21262d;font-size:0.9em}
tr:hover{background:#161b22}
.stats{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;min-width:150px}
.stat-card .val{font-size:1.8em;color:#58a6ff;font-weight:700}
.stat-card .lbl{color:#8b949e;font-size:0.85em}
#file-input{display:none}
</style>
</head>
<body>
<div class="header"><h1>KORE Viewer</h1><span style="color:#8b949e">Drop a .hkore file to inspect</span></div>

<div class="drop-zone" id="dropZone" onclick="document.getElementById('file-input').click()">
<h2>Drop .hkore file here</h2>
<p>or click to browse</p>
</div>
<input type="file" id="file-input" accept=".hkore,.kore">

<div id="output">
<div class="stats" id="stats"></div>
<div class="meta" id="header-text"></div>
<div style="overflow-x:auto"><table id="data-table"></table></div>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('file-input');
const output = document.getElementById('output');

['dragenter','dragover'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.add('active'); }));
['dragleave','drop'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); dropZone.classList.remove('active'); }));
dropZone.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));
fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => parseHkore(new Uint8Array(e.target.result), file.name, file.size);
    reader.readAsArrayBuffer(file);
}

function parseHkore(bytes, name, size) {
    const decoder = new TextDecoder();
    const prefix = decoder.decode(bytes.slice(0, 24));

    if (!prefix.startsWith('KORE2')) {
        alert('Not a valid .hkore file (missing KORE2 header)');
        return;
    }

    const binaryStart = parseInt(prefix.slice(13, 23));
    const headerText = decoder.decode(bytes.slice(0, binaryStart));

    // Parse header for metadata
    const lines = headerText.split('\n');
    let rows = 0, cols = 0, schema = [], created = '';
    for (const line of lines) {
        const rm = line.match(/Rows:\s*([\d,]+)/);
        if (rm) rows = parseInt(rm[1].replace(/,/g, ''));
        const cm = line.match(/Columns:\s*(\d+)/);
        if (cm) cols = parseInt(cm[1]);
        const tm = line.match(/Created:\s*(.+)/);
        if (tm) created = tm[1];
        const sm = line.match(/#\s{3}(\S+)\s+(I64|F64|STR|LIST_\w+)/);
        if (sm) schema.push({ name: sm[1], type: sm[2] });
    }

    // Parse binary data
    const view = new DataView(bytes.buffer, binaryStart);
    let pos = 0;
    const magic = decoder.decode(bytes.slice(binaryStart, binaryStart + 4));
    pos += 4;
    const nrows = view.getUint32(pos, true); pos += 4;
    const ncols = view.getUint16(pos, true); pos += 2;

    const colMeta = [];
    for (let i = 0; i < ncols; i++) {
        const dtype = view.getUint8(pos); pos += 1;
        const nameLen = view.getUint16(pos, true); pos += 2;
        const colName = decoder.decode(bytes.slice(binaryStart + pos, binaryStart + pos + nameLen));
        pos += nameLen;
        colMeta.push({ name: colName, dtype });
    }

    // Read column data (first 200 rows max for display)
    const maxDisplay = Math.min(nrows, 200);
    const colData = [];
    for (const meta of colMeta) {
        const values = [];
        if (meta.dtype === 2) { // STR
            for (let i = 0; i < nrows; i++) {
                const slen = view.getUint32(pos, true); pos += 4;
                if (i < maxDisplay) {
                    values.push(decoder.decode(bytes.slice(binaryStart + pos, binaryStart + pos + slen)));
                }
                pos += slen;
            }
        } else { // I64 or F64
            for (let i = 0; i < nrows; i++) {
                if (i < maxDisplay) {
                    if (meta.dtype === 0) values.push(view.getFloat64(pos, true));
                    else values.push(Number(view.getBigInt64(pos, true)));
                }
                pos += 8;
            }
        }
        colData.push(values);
    }

    // Render
    document.getElementById('stats').innerHTML =
        `<div class="stat-card"><div class="val">${nrows.toLocaleString()}</div><div class="lbl">Rows</div></div>` +
        `<div class="stat-card"><div class="val">${ncols}</div><div class="lbl">Columns</div></div>` +
        `<div class="stat-card"><div class="val">${(size/1024).toFixed(0)} KB</div><div class="lbl">File Size</div></div>` +
        `<div class="stat-card"><div class="val">${name}</div><div class="lbl">File Name</div></div>`;

    document.getElementById('header-text').textContent = headerText;

    let html = '<tr>' + colMeta.map(c => `<th>${c.name} <small style="color:#8b949e">(${c.dtype===0?'F64':c.dtype===1?'I64':'STR'})</small></th>`).join('') + '</tr>';
    for (let i = 0; i < maxDisplay; i++) {
        html += '<tr>' + colData.map(col => {
            let v = col[i];
            if (typeof v === 'number' && !Number.isInteger(v)) v = v.toFixed(4);
            return `<td>${v}</td>`;
        }).join('') + '</tr>';
    }
    if (nrows > maxDisplay) html += `<tr><td colspan="${ncols}" style="text-align:center;color:#8b949e">... ${(nrows-maxDisplay).toLocaleString()} more rows ...</td></tr>`;

    document.getElementById('data-table').innerHTML = html;
    output.style.display = 'block';
    dropZone.style.display = 'none';
}
</script>
</body>
</html>
