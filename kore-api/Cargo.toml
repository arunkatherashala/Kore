[package]
name    = "kore-api"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "kore-api"
path = "src/main.rs"

[dependencies]
kore-core     = { workspace = true }
kore-join     = { workspace = true }
kore-cache    = { workspace = true }
kore-ml2      = { workspace = true }
kore-ml3      = { workspace = true }
kore-sql      = { workspace = true }
kore-store    = { workspace = true }
tokio         = { workspace = true }
axum          = { workspace = true }
tower-http    = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
# Phase 2E: Security & Authentication
jsonwebtoken  = "9.2"
ldap3         = "0.11"
governor      = "0.7"
axum-server   = { version = "0.6", features = ["tls-rustls"] }
rustls-pemfile = "2.0"
uuid          = { workspace = true }
chrono        = "0.4"

