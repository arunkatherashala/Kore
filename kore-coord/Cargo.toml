[package]
name    = "kore-coord"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "kore-coord"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
kore-core     = { workspace = true }
kore-net      = { path = "../kore-net" }
kore-sql      = { path = "../kore-sql" }
kore-worker   = { path = "../kore-worker" }
kore-fault    = { path = "../kore-fault" }
kore-shuffle  = { path = "../kore-shuffle" }
kore-catalog  = { path = "../kore-catalog" }
kore-catalyst = { path = "../kore-catalyst" }
kore-aqe       = { path = "../kore-aqe" }
kore-metrics   = { path = "../kore-metrics" }
kore-security  = { path = "../kore-security" }
kore-sortmerge    = { path = "../kore-sortmerge" }
kore-parquet      = { path = "../kore-parquet" }
kore-object-store = { path = "../kore-object-store" }
kore-store        = { path = "../kore-store" }
serde_json        = { workspace = true }
tokio             = { workspace = true }

[dev-dependencies]
kore-core   = { workspace = true }
kore-worker = { path = "../kore-worker" }
kore-sql    = { path = "../kore-sql" }
tokio       = { workspace = true, features = ["full", "test-util"] }

