[workspace]
members = [
    "kore-core",
    "kore-join",
    "kore-cache",
    "kore-ml2",
    "kore-pipeline",
    "kore-cluster",
    "kore-bench",
    "kore-sql",      # Layer 21 — KQL query language
    "kore-store",    # Layer 22 — columnar storage engine
    "kore-ml3",      # Layer 23 — more ML: LinReg, KNN, SVM, LogReg
    "kore-ml",       # Layer 24 — Unified ML API (all 7 algorithms + distributed training)
    "kore-ffi",      # Layer 24 — C ABI + 7-language bindings
    "kore-api",      # Layer 25 — Axum REST / WebSocket API
    "kore-window",   # Layer 27 — Window functions
    "kore-io",       # Layer 28 — File I/O
    "kore-shuffle",  # Layer 29 — Distributed shuffle
    "kore-spill",    # Layer 30 — Out-of-core / spill
    "kore-stream",   # Layer 31 — Structured streaming
    "kore-parquet",  # Layer 32 — Parquet I/O
    "kore-optimize", # Layer 33 — Query optimizer
    "kore-parallel", # Layer 35 — Parallel query execution (Rayon)
    "kore-bloom",    # Layer 36 — Bloom filter joins
    "kore-net",      # Layer 37 — Network transport (TCP framing)
    "kore-worker",   # Layer 38 — Distributed worker node
    "kore-coord",    # Layer 39 — Cluster coordinator / master
    "kore-fault",    # Layer 40 — Fault tolerance (lineage + retry)
    "kore-aqe",      # Layer 41 — Adaptive Query Execution
    "kore-simd",     # Layer 42 — Vectorized / SIMD execution
    "kore-delta",    # Layer 43 — ACID Delta Lake (transactions, time travel)
    "kore-catalog",  # Layer 44 — Column histograms + cardinality estimation
    "kore-compress", # Layer 45 — Column compression (dict, RLE, bit-pack)
    "kore-codegen",  # Layer 46 — Compiled query predicates (zero interpreter)
    "kore-mv",       # Layer 47 — Materialized views + incremental refresh
    "kore-prune",    # Layer 48 — Zone-map partition pruning
    "kore-dml",      # Layer 49 — DML: INSERT/UPDATE/DELETE/MERGE/CTAS
    "kore-subquery", # Layer 50 — Scalar/IN/EXISTS subqueries
    "kore-catalyst", # Layer 51 — Full Catalyst-level query optimizer
    "kore-distml",   # Layer 52 — Distributed ML across workers
    "kore-connect",  # Layer 53 — Arrow/IPC, JSON, HTTP connectors
    "kore-rm",           # Layer 54 — Cluster resource manager
    "kore-shuffle-store",# Layer 55 — Persistent shuffle store (disk-based, TB-scale)
    "kore-object-store", # Layer 56 — S3/GCS/Azure Blob cloud storage abstraction
    "kore-metrics",      # Layer 57 — Prometheus metrics + job/query history
    "kore-security",     # Layer 58 — Token auth, RBAC, TLS config
    "kore-sql-v2",       # Layer 59 — DISTINCT, EXCEPT, INTERSECT, ROLLUP, CUBE
    "kore-iceberg",      # Layer 60 — Apache Iceberg table format
    "kore-mcp",          # Layer 61 — MCP server (AI assistant integration)
    "kore-arrow",        # Layer 62 — Apache Arrow compact columnar format (50% less RAM)
    "kore-vectorized",   # Layer 63 — Vectorized batch SQL (1024-row SIMD chunks)
    "kore-gpu",          # Layer 64 — GPU compute (wgpu/CUDA GROUP BY, sort, filter)
    # kore-self / kore-body / kore-federation / kore-mesh / kore-survival
    # → feature/digital-life branch (not part of the engine workspace)
    "kore-distributed",  # Layer 66 — Distributed SQL engine (SQL→cluster wire-up)
    "kore-dist-net",     # Layer 67 — TRUE network distribution (TCP workers, real multi-node)
    "kore-jit",          # Layer 68 — JIT/compiled execution (low-cardinality GROUP BY, compiled filters)
    "kore-tpch",         # TPC-H benchmark suite (real timing vs Spark)
    "kore-python",       # Layer 70 — Python ctypes bindings (C ABI bridge)
    "kore-pyo3",         # Layer 70B — PyO3 native Python bindings (pip install)
    "kore-sortmerge",    # Layer 71 — Sort-merge join + broadcast join strategy
    "kore-kafka",        # Layer 72 — Kafka-compatible streaming source/sink
    "kore-mlx",          # Layer 73 — Expanded ML: RandomForest, LogReg, KMeans
    "kore-node",         # Layer 74 — True multi-node cluster (TCP gRPC-style)
    "kore-deploy",       # Phase 3B — Kubernetes/standalone deployment
    "kore-flight",       # Phase 4A — Arrow IPC serialization & Flight service
    "kore-server",       # Phase 4C — PostgreSQL wire protocol server
    "kore-submit",       # CLI — spark-submit-style job submission
    "kore-demo",         # End-to-end demo binary
    "kore-hdfs",         # Layer 75 — HDFS connector (WebHDFS REST)
    # Phase 2 Infrastructure (v1.0.0→v2.0 transition)
    "kore-benchmark",    # Phase 2A — Multi-engine benchmarking (TPC-H/DS, YCSB)
    "kore-streaming",    # Phase 2D — Structured streaming (Kafka/Kinesis, stateful, 100K+ eps)
    "kore-graph",        # Phase 2F — Graph algorithms (PageRank, Shortest Path, CC, etc.)
    "kore-sdk",          # Phase 2G — Multi-language SDK generation (Python, Java, Go, C#, Ruby, R, Scala, Node.js)
    
    # Phase 3: AI/LLM Integration (v3.0.0)
    "kore-vectors",      # Phase 3A — Vector/semantic search (HNSW, ANN, embeddings)
    "kore-llm",          # Phase 3B — LLM inference (Llama, Mistral, Phi; quantization, streaming)
    "kore-rag",          # Phase 3C — RAG pipeline (document chunking, retrieval, augmentation)
    "kore-rl",           # Phase 3D — Reinforcement learning (Q-learning, policy gradient, multi-armed bandit)
    
    # Phase 4: Advanced ML/GenAI
    "kore-finetune",     # Phase 4A — Fine-tuning framework (LoRA, QLoRA, adapter modules)
    "kore-multimodal",   # Phase 4C — Multimodal (images, audio, video embeddings; CLIP)
    "kore-timeseries",   # Phase 4D — Time-series + forecasting (LSTM, Transformer, ARIMA, Prophet)
    
    # Phase 5: Enterprise AI
    "kore-mlops",        # Phase 5A — Model registry, versioning, A/B testing, drift detection
    "kore-explainability", # Phase 5B — Explainability (SHAP, LIME, attention, counterfactuals)
    "kore-privacy",      # Phase 5C — Privacy (differential privacy, federated learning, homomorphic encryption)
    "kore-automl",       # Phase 5D — AutoML (hyperparameter optimization, NAS, feature engineering)
    
    # Phase 6: Knowledge Graphs & Reasoning
    "kore-knowledge-graph", # Phase 6A — Knowledge graph engine (RDF, SPARQL, embeddings)
    "kore-gnn",          # Phase 6B — Graph neural networks (GCN, GAT, GraphSAGE)
    "kore-qa",           # Phase 6C — Question answering (KGQA, multi-hop reasoning, semantic parsing)
    "kore-logic",        # Phase 6D — Logic programming (Datalog, Prolog-like inference, constraints)
    
    # Phase 7: Autonomous Systems
    "kore-autonomy",     # Phase 7A-7D — Query optimization AI, autonomous caching, self-healing, cost optimization
    "kore-causality",    # Phase 8A — Causal inference (causal graphs, counterfactuals, treatment effects)
    "kore-continual-learning", # Phase 8B — Continual learning (online learning, concept drift, domain adaptation)
    "kore-meta-learning", # Phase 8C — Meta-learning (few-shot learning, transfer learning, task adaptation)
    "kore-neurosymbolic", # Phase 8D — Neurosymbolic AI (neural-symbolic integration, logic constraints)
    "kore-quantum",      # Quantum — Quantum-ready architecture (QAOA, VQE, hybrid execution)
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
authors = ["KORE Team"]
license = "Apache-2.0"

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
rayon       = "1"
tokio       = { version = "1", features = ["full"] }
parquet     = { version = "59", features = ["arrow"] }
arrow-array = "59"
arrow-schema = "59"
lz4_flex    = "0.11"
axum        = "0.8"
tower-http  = { version = "0.6", features = ["cors", "trace"] }
libc        = "0.2"
chrono      = "0.4"
uuid        = { version = "1", features = ["v4"] }
async-trait = "0.1"
indicatif   = "0.17"
prost       = "0.12"
tonic       = { version = "0.11", features = ["transport"] }
kore-core   = { path = "kore-core" }
kore-join   = { path = "kore-join" }
kore-cache  = { path = "kore-cache" }
kore-ml2    = { path = "kore-ml2" }
kore-pipeline = { path = "kore-pipeline" }
kore-cluster  = { path = "kore-cluster" }
kore-sql    = { path = "kore-sql" }
kore-store  = { path = "kore-store" }
kore-ml3    = { path = "kore-ml3" }
kore-ml     = { path = "kore-ml" }
kore-window = { path = "kore-window" }
kore-io     = { path = "kore-io" }
kore-shuffle = { path = "kore-shuffle" }
kore-spill  = { path = "kore-spill" }
kore-parquet = { path = "kore-parquet" }
kore-optimize = { path = "kore-optimize" }
kore-parallel = { path = "kore-parallel" }
kore-gpu     = { path = "kore-gpu" }
kore-arrow   = { path = "kore-arrow" }

kore-mcp    = { path = "kore-mcp" }
kore-python      = { path = "kore-python" }
kore-sortmerge = { path = "kore-sortmerge" }
kore-kafka     = { path = "kore-kafka" }
kore-mlx       = { path = "kore-mlx" }
kore-node      = { path = "kore-node" }
kore-deploy    = { path = "kore-deploy" }

# Phase 2 Infrastructure (v1.0.0→v2.0 transition)
kore-benchmark = { path = "kore-benchmark" }
kore-streaming = { path = "kore-streaming" }
kore-graph     = { path = "kore-graph" }
kore-sdk       = { path = "kore-sdk" }
