[package]
name = "kore_fileformat"
version = "1.5.0"
edition = "2021"
description = "KORE — Killer Optimized Record Exchange: ACID + Multi-Cloud + SIMD + GPU"
readme = "README.md"
license-file = "KUOPL-LICENSE"
authors = ["Sai Arun Kumar Ktherashala <arunkatherashala@gmail.com>"]
repository = "https://github.com/arunkatherashala/Kore"
homepage = "https://github.com/arunkatherashala/Kore"
documentation = "https://docs.rs/kore_fileformat"
keywords = ["columnar", "file-format", "analytics", "compression", "kore", "gpu", "simd"]
categories = ["encoding", "compression", "database-implementations"]
include = [
    "src/",
    "Cargo.toml",
    "README.md",
    "KUOPL-LICENSE"
]

[features]
default = []
kore_lite_compat = []
# TRACK B: DuckDB integration
duckdb-ffi = []
# TRACK A: Performance SIMD (auto-detected at compile time)
simd-optimize = []
# TRACK E: GPU acceleration
gpu-cuda = []
# Cloud connector features (requires disk space for SDK compilation)
s3 = ["aws-sdk-s3", "tokio", "aws-config"]
azure = ["azure_storage", "tokio", "azure_identity", "futures-util"]
gcs = ["google-cloud-storage", "tokio", "google-cloud-default"]
# Language bindings
pyo3 = ["pyo3/extension-module"]
java = ["jni"]
napi = ["napi/napi8", "napi-derive"]
# TRACK D: Time-series optimizations
timeseries-opt = []
# Meta features
full = ["s3", "azure", "gcs", "pyo3", "java", "duckdb-ffi", "gpu-cuda", "timeseries-opt", "simd-optimize"]

[dependencies]
# Optional cloud storage support - commented out due to disk space constraints
# Uncomment when sufficient disk space available

# AWS S3
aws-sdk-s3 = { version = "1.30", optional = true }
aws-config = { version = "1.1", optional = true }

# Azure Blob Storage
azure_storage = { version = "0.20", optional = true }
azure_identity = { version = "0.17", optional = true }

# Google Cloud Storage
google-cloud-storage = { version = "0.20", optional = true }
google-cloud-default = { version = "0.2", optional = true }

# Shared async runtime
tokio = { version = "1.36", features = ["full"], optional = true }

# Stream utilities for Azure
futures-util = { version = "0.3", optional = true }

# CPU count for parallel execution + parallelization
num_cpus = "1.16"
rayon = "1.8"  # TRACK A: Parallel processing

# Language bindings
pyo3 = { version = "0.21", optional = true }
maturin = { version = "1.5", optional = true }

# Java/JNI bindings
jni = { version = "0.21", optional = true }

# JavaScript/NAPI bindings
napi = { version = "2.15", optional = true }
napi-derive = { version = "2.15", optional = true }

# Logging + debugging
log = "0.4"
env_logger = "0.11"

# Serialization and time utilities
chrono = "0.4.44"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.4", features = ["v4"] }
tempfile = "3.6"

# Memory detection for adaptive sizing
sysinfo = "0.30"

[lib]
name = "kore_fileformat"
path = "src/lib.rs"
# Generate dynamic library for JNI/NAPI bindings AND allow internal linking for tests/bins
crate-type = ["cdylib", "rlib"]

[workspace]
members = [
    "rust/sql_parser",
    "rust/kore_fileformat",
    "rust/sql_executor",
    "kore-cli",
    "kore-sample",
    "kore-reader",
]
