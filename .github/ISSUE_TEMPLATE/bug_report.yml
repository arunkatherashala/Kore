name: Bug Report
description: Report a bug or unexpected behavior in Kore v1.2.3
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide as much detail as possible so we can investigate quickly.

  - type: dropdown
    id: component
    attributes:
      label: Which language/component?
      options:
        - Python SDK
        - Java SDK
        - Go SDK
        - JavaScript/TypeScript SDK
        - C# / .NET SDK
        - Ruby SDK
        - Rust Core
        - Spark Connector
        - Hadoop Connector
        - Hive Connector
        - DuckDB Connector
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Kore version
      placeholder: "1.2.3"
      description: Which version are you using?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "e.g., Python 3.11 on Windows 11, Java 17 on Ubuntu 22.04"
      description: What's your OS, language version, runtime environment?
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      placeholder: |
        Describe the issue clearly. What were you trying to do? What happened instead?
      description: Clear description of the problem
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install Kore with: [command]
        2. Write code like: [example]
        3. Run: [command]
        4. Error: [error message]
      description: How can we reproduce this issue?
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal code example
      placeholder: |
        ```python
        import kore_fileformat
        # Your code here
        ```
      description: Paste minimal code that reproduces the issue
      render: "python"

  - type: textarea
    id: error
    attributes:
      label: Error message (exact text)
      placeholder: |
        Paste the complete error message/traceback here
      description: Include full error output

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "What should have happened instead?"
      description: What did you expect to happen?

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      placeholder: |
        - Related issues: #123
        - Documentation: [link]
        - Screenshots: [if applicable]
      description: Any other context that might help

  - type: checkboxes
    id: verification
    attributes:
      label: Verification
      options:
        - label: "I can reproduce this consistently"
          required: true
        - label: "I've checked existing issues"
          required: true
        - label: "I've read the documentation"
