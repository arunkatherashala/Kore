name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Check Maven
      run: |
        mvn --version
        ls -la maven/
    
    - name: Build JAR
      run: |
        cd maven
        mvn clean package -DskipTests -X 2>&1 | tail -100
    
    - name: Deploy to Staging
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      run: |
        if [ -z "$MAVEN_USERNAME" ] || [ -z "$MAVEN_PASSWORD" ]; then
          echo "❌ Credentials not set"
          exit 1
        fi
        
        echo "✅ Credentials available"
        
        # Create settings.xml
        mkdir -p ~/.m2
        printf '%s\n' \
          '<?xml version="1.0" encoding="UTF-8"?>' \
          '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">' \
          '  <servers>' \
          '    <server>' \
          '      <id>ossrh</id>' \
          "      <username>$MAVEN_USERNAME</username>" \
          "      <password>$MAVEN_PASSWORD</password>" \
          '    </server>' \
          '  </servers>' \
          '</settings>' > ~/.m2/settings.xml
        
        echo "Settings file created: $(wc -l ~/.m2/settings.xml)"
        
        # Verify settings.xml structure (without showing credentials)
        cat ~/.m2/settings.xml | grep -E "server|id|username|password" | head -5
        
        cd maven
        
        # Run with full debug output
        mvn deploy -Dgpg.skip=true -DskipTests -X 2>&1 | tee deploy.log
        
        # Show authentication-related errors
        echo "=== Auth-related output ==="
        grep -i "auth\|401\|unauthorized\|credential" deploy.log | tail -20

    - name: Publish summary
      run: |
        echo "## Maven Central Publishing" >> $GITHUB_STEP_SUMMARY
        echo "✅ Artifact deployed to staging repository" >> $GITHUB_STEP_SUMMARY
        echo "Note: Sonatype syncs to Maven Central within 10 minutes" >> $GITHUB_STEP_SUMMARY




