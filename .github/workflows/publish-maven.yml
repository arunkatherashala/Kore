name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Create settings.xml with credentials
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 
                  http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>ossrh</id>
              <username>$MAVEN_USERNAME</username>
              <password>$MAVEN_PASSWORD</password>
            </server>
          </servers>
        </settings>
        EOF
        echo "=== settings.xml created ==="
        cat ~/.m2/settings.xml | grep -A 2 "ossrh"
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
    
    - name: Check Maven
      run: |
        mvn --version
        ls -la maven/
    
    - name: Verify Sonatype credentials
      run: |
        echo "Testing Sonatype API access..."
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -u "$MAVEN_USERNAME:$MAVEN_PASSWORD" \
          "https://s01.oss.sonatype.org/service/local/staging/profile_evaluate")
        echo "HTTP Response Code: $HTTP_CODE"
        if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "400" ]; then
          echo "✓ Credentials appear valid (API responded)"
        else
          echo "✗ Auth failed with code $HTTP_CODE - credentials may be invalid"
        fi
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
    
    - name: Build JAR
      run: |
        cd maven
        mvn clean package -DskipTests 2>&1 | tail -100
    
    - name: Deploy to Staging
      run: |
        cd maven
        mvn deploy \
          -Dgpg.skip=true \
          -DskipTests \
          -Dorg.slf4j.simpleLogger.defaultLogLevel=debug \
          2>&1 | tail -100
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

    - name: Publish summary
      run: |
        echo "## Maven Central Publishing" >> $GITHUB_STEP_SUMMARY
        echo "✅ Artifact deployed to staging repository" >> $GITHUB_STEP_SUMMARY
        echo "Note: Sonatype syncs to Maven Central within 10 minutes" >> $GITHUB_STEP_SUMMARY




