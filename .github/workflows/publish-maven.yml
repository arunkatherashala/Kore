name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Clean up Maven cache
      run: rm -rf ~/.m2

    - name: Configure Maven for Maven Central
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>ossrh</id>
              <username></username>
              <password></password>
            </server>
          </servers>
        </settings>
        EOF
        # Use sed with proper escaping for credentials
        sed -i 's|<username></username>|<username>'"$MAVEN_USERNAME"'</username>|g' ~/.m2/settings.xml
        sed -i 's|<password></password>|<password>'"$MAVEN_PASSWORD"'</password>|g' ~/.m2/settings.xml
        # Display settings.xml for debugging (secrets will be masked)
        cat ~/.m2/settings.xml
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
    
    - name: Build JAR
      run: |
        cd maven
        mvn clean package -DskipTests

    - name: Deploy to Maven Central
      run: |
        cd maven
        mvn deploy \
          -s ~/.m2/settings.xml \
          -Dmaven.test.skip=true \
          -DskipTests \
          -Dorg.slf4j.simpleLogger.defaultLogLevel=warn \
          -DaltReleaseDeploymentRepository=ossrh::default::https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/ \
          -Dgpg.skip=true
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

    - name: Publish summary
      run: |
        echo "## Maven Package Published to Maven Central" >> $GITHUB_STEP_SUMMARY
        echo "✅ Artifact deployed to: Maven Central Repository" >> $GITHUB_STEP_SUMMARY
        echo "Package: io.github.arunkatherashala:kore-fileformat:1.2.1" >> $GITHUB_STEP_SUMMARY
        echo "Access: https://github.com/arunkatherashala/Kore/packages" >> $GITHUB_STEP_SUMMARY




