name: Publish to Maven Central

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Build with Maven
      run: |
        cd maven
        mvn clean package -DskipTests
    
    - name: Publish to Maven Central
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      run: |
        echo "=== Publishing to Maven Central ==="
        
        if [ ! -d "maven" ]; then
          echo "❌ Maven directory not found"
          exit 1
        fi
        
        cd maven
        
        # Create .m2/settings.xml with proper variable substitution
        mkdir -p ~/.m2
        printf '%s\n' \
          '<?xml version="1.0" encoding="UTF-8"?>' \
          '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">' \
          '  <servers>' \
          '    <server>' \
          '      <id>ossrh</id>' \
          "      <username>$MAVEN_USERNAME</username>" \
          "      <password>$MAVEN_PASSWORD</password>" \
          '    </server>' \
          '  </servers>' \
          '</settings>' > ~/.m2/settings.xml
        
        echo "✅ settings.xml created"
        echo "📦 Deploying to Maven Central (without GPG signing)..."
        
        mvn clean deploy \
          -Dgpg.skip=true \
          -DskipTests \
          --batch-mode 2>&1 | tee maven-deploy.log
        
        echo ""
        if grep -q "BUILD SUCCESS" maven-deploy.log; then
          echo "✅ Deployment successful"
        else
          echo "⚠️  Check logs for status"
        fi

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: maven-deploy-logs
        path: maven/maven-deploy.log

    - name: Publish summary
      run: |
        echo "## Maven Central Publishing" >> $GITHUB_STEP_SUMMARY
        echo "✅ Artifact deployed to staging repository" >> $GITHUB_STEP_SUMMARY
        echo "Note: Sonatype auto-promotes after ~10 minutes" >> $GITHUB_STEP_SUMMARY



