name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Configure Maven for Maven Central
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>ossrh</id>
              <username>$MAVEN_USERNAME</username>
              <password>$MAVEN_PASSWORD</password>
            </server>
          </servers>
          <profiles>
            <profile>
              <id>ossrh</id>
              <activation>
                <activeByDefault>true</activeByDefault>
              </activation>
              <properties>
                <gpg.executable>gpg</gpg.executable>
                <gpg.passphrase>$GPG_PASSPHRASE</gpg.passphrase>
              </properties>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>ossrh</activeProfile>
          </activeProfiles>
        </settings>
        EOF
        # Substitute environment variables using sed
        sed -i "s|\$MAVEN_USERNAME|${{ secrets.MAVEN_USERNAME }}|g" ~/.m2/settings.xml
        sed -i "s|\$MAVEN_PASSWORD|${{ secrets.MAVEN_PASSWORD }}|g" ~/.m2/settings.xml
        sed -i "s|\$GPG_PASSPHRASE|${{ secrets.GPG_PASSPHRASE }}|g" ~/.m2/settings.xml
    
    - name: Build JAR
      run: |
        cd maven
        mvn clean package -DskipTests

    - name: Deploy to Maven Central
      run: |
        cd maven
        mvn deploy \
          -Dmaven.test.skip=true \
          -DskipTests \
          -Dorg.slf4j.simpleLogger.defaultLogLevel=warn \
          -DrepositoryId=ossrh \
          -Dgpg.skip=true
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

    - name: Publish summary
      run: |
        echo "## Maven Package Published to Maven Central" >> $GITHUB_STEP_SUMMARY
        echo "✅ Artifact deployed to: Maven Central Repository" >> $GITHUB_STEP_SUMMARY
        echo "Package: io.github.arunkatherashala:kore-fileformat:1.2.1" >> $GITHUB_STEP_SUMMARY
        echo "Access: https://github.com/arunkatherashala/Kore/packages" >> $GITHUB_STEP_SUMMARY




