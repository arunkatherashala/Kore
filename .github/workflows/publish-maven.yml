name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        server-id: github
        server-username: ${{ github.actor }}
        server-password: ${{ github.token }}
    
    - name: Build JAR
      run: |
        cd maven
        mvn clean package -DskipTests
    
    - name: Deploy to GitHub Packages
      run: |
        cd maven
        mvn deploy \
          -Dmaven.test.skip=true \
          -DskipTests \
          -Dorg.slf4j.simpleLogger.defaultLogLevel=warn \
          -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/arunkatherashala/Kore
      env:
        MAVEN_USERNAME: ${{ github.actor }}
        MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish summary
      run: |
        echo "## Maven Package Published to GitHub Packages" >> $GITHUB_STEP_SUMMARY
        echo "✅ Artifact deployed to: maven.pkg.github.com/arunkatherashala/Kore" >> $GITHUB_STEP_SUMMARY
        echo "Package: io.github.arunkatherashala:kore-fileformat:1.2.1" >> $GITHUB_STEP_SUMMARY
        echo "Access: https://github.com/arunkatherashala/Kore/packages" >> $GITHUB_STEP_SUMMARY




