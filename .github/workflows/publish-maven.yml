name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        server-id: ossrh
        server-username: ${{ secrets.MAVEN_USERNAME }}
        server-password: ${{ secrets.MAVEN_PASSWORD }}
    
    - name: Check Maven
      run: |
        mvn --version
        ls -la maven/
    
    - name: Build JAR
      run: |
        cd maven
        mvn clean package -DskipTests -X 2>&1 | tail -100
    
    - name: Deploy to Staging
      run: |
        cd maven
        mvn deploy -Dgpg.skip=true -DskipTests 2>&1 | tail -50

    - name: Publish summary
      run: |
        echo "## Maven Central Publishing" >> $GITHUB_STEP_SUMMARY
        echo "✅ Artifact deployed to staging repository" >> $GITHUB_STEP_SUMMARY
        echo "Note: Sonatype syncs to Maven Central within 10 minutes" >> $GITHUB_STEP_SUMMARY




