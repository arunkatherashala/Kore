name: Publish to Maven Central

on:
  # Manual only. Started by "Auto Version Bump & Deploy" (itself manual) on the new v* tag,
  # or by hand on a v* tag. No push/tag/release triggers: a pushed tag alone never publishes.
  # Every publishing job needs the guard job (v* tag + green CI) and runs in the "release"
  # environment (add required reviewers and the registry secrets there in GitHub settings).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: "Release guard: v* tag and green CI"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a v* tag whose commit passed the full CI gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          HOLD: ${{ vars.RELEASE_HOLD }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          if [ "$HOLD" = "true" ]; then
            fail "Publishing is on hold: repository variable RELEASE_HOLD is 'true' (Settings -> Secrets and variables -> Actions -> Variables). Set it to false or delete it, then re-run."
          fi
          case "$REF" in refs/tags/v*) ;; *) fail "publish only runs on a v* tag (got $REF)";; esac
          # any successful push run of ci.yml for the SHA counts (a promoted commit may also have a newer run on stable)
          ci() { gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$1&event=push&per_page=100" --jq 'if any(.workflow_runs[]; .conclusion == "success") then "success" else (.workflow_runs[0].conclusion // .workflow_runs[0].status // "none") end'; }
          C="$(ci "$SHA")"
          echo "CI for tag commit $SHA: $C"
          if [ "$C" != "success" ]; then
            # The release workflow tags its own version-bump commit ([skip ci]); then the commit it bumped must be green.
            MSG="$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message' | head -1)"
            WHO="$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.committer.name')"
            NPAR="$(gh api "repos/$REPO/commits/$SHA" --jq '.parents | length')"
            case "$MSG" in "chore: auto-bump "*) ;; *) fail "tag commit has no successful CI run and is not a version-bump commit";; esac
            [ "$WHO" = "github-actions[bot]" ] && [ "$NPAR" = "1" ] || fail "version-bump commit not made by the release workflow"
            ALLOWED=" pyproject.toml kore-python/kore_fileformat.py kore-python/README.md kore-node/package.json kore-node/README.md kore-ruby/kore_fileformat.gemspec kore-ruby/README.md kore-go/go.mod kore-go/README.md kore-php/composer.json kore-php/README.md maven/README.md maven/pom.xml csharp/Kore.FileFormat/README.md csharp/Kore.FileFormat/Kore.FileFormat.csproj kore-standalone/Cargo.toml kore-standalone/README.md "
            for f in $(gh api "repos/$REPO/commits/$SHA" --jq '.files[].filename'); do
              case "$ALLOWED" in *" $f "*) ;; *) fail "version-bump commit also changes $f";; esac
            done
            PARENT="$(gh api "repos/$REPO/commits/$SHA" --jq '.parents[0].sha')"
            C="$(ci "$PARENT")"
            echo "CI for bumped commit $PARENT: $C"
          fi
          [ "$C" = "success" ] || fail "CI has not passed (conclusion: $C); not publishing"

  build-and-publish:
    needs: guard
    environment: release
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    
    - name: Extract version
      id: version
      run: |
        # For tag-triggered workflows, use the tag (remove v prefix)
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        else
          # Extract version from pom.xml
          VERSION=$(grep -m1 '<version>' maven/pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Version detected: ${VERSION}"
    
    - name: Build Maven package
      working-directory: maven
      run: |
        mvn clean package -DskipTests -Dgpg.skip=true
        echo "Build completed successfully"
        ls -lh target/*.jar
    
    - name: Extract pom.xml and jar files
      working-directory: maven
      run: |
        cp pom.xml target/
        echo "Artifacts prepared:"
        ls -lh target/*.jar target/pom.xml
    
    - name: Deploy to Maven Central Portal
      if: startsWith(github.ref, 'refs/tags/')
      env:
        CENTRAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        cd maven/target
        
        # Verify all artifacts exist
        if [[ ! -f "kore-fileformat-${VERSION}.jar" ]]; then
          echo "ERROR: Main JAR not found"
          exit 1
        fi
        
        if [[ ! -f "kore-fileformat-${VERSION}-sources.jar" ]]; then
          echo "ERROR: Sources JAR not found"
          exit 1
        fi
        
        if [[ ! -f "kore-fileformat-${VERSION}-javadoc.jar" ]]; then
          echo "ERROR: Javadoc JAR not found"
          exit 1
        fi
        
        # Deploy using Central Portal API
        echo "Deploying to Maven Central Portal..."
        
        RESPONSE=$(curl -v \
          -F "bundle=@kore-fileformat-${VERSION}.jar" \
          -F "bundle=@kore-fileformat-${VERSION}-sources.jar" \
          -F "bundle=@kore-fileformat-${VERSION}-javadoc.jar" \
          -F "bundle=@pom.xml" \
          --basic -u "${CENTRAL_USERNAME}:${CENTRAL_PASSWORD}" \
          "https://central.sonatype.com/api/v1/publisher/upload" 2>&1)
        
        echo "Response:"
        echo "${RESPONSE}"
        
        # Check for success (201 Created)
        if echo "${RESPONSE}" | grep -q "201"; then
          echo "✅ Deployment successful! (HTTP 201 Created)"
          echo "Package will be indexed in 10-15 minutes"
          echo "Search: https://central.sonatype.com/search?q=kore-fileformat"
        elif echo "${RESPONSE}" | grep -q "200"; then
          echo "✅ Deployment accepted! (HTTP 200)"
          echo "Package will be indexed shortly"
        else
          echo "❌ Deployment may have failed"
          exit 1
        fi
    
    - name: Publish Summary
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        VERSION=${{ steps.version.outputs.version }}
        echo "## 📦 Maven Central Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Package**: com.github.arunkatherashala:kore-fileformat" >> $GITHUB_STEP_SUMMARY
        echo "**Version**: ${VERSION}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Artifacts Deployed" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ kore-fileformat-${VERSION}.jar" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ kore-fileformat-${VERSION}-sources.jar" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ kore-fileformat-${VERSION}-javadoc.jar" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ pom.xml" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. Wait 10-15 minutes for indexing" >> $GITHUB_STEP_SUMMARY
        echo "2. Search: [Maven Central Portal](https://central.sonatype.com/search?q=kore-fileformat)" >> $GITHUB_STEP_SUMMARY
        echo "3. Use in Maven:" >> $GITHUB_STEP_SUMMARY
        echo "   \`\`\`xml" >> $GITHUB_STEP_SUMMARY
        echo "   <dependency>" >> $GITHUB_STEP_SUMMARY
        echo "     <groupId>com.github.arunkatherashala</groupId>" >> $GITHUB_STEP_SUMMARY
        echo "     <artifactId>kore-fileformat</artifactId>" >> $GITHUB_STEP_SUMMARY
        echo "     <version>${VERSION}</version>" >> $GITHUB_STEP_SUMMARY
        echo "   </dependency>" >> $GITHUB_STEP_SUMMARY
        echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "4. Or in Gradle:" >> $GITHUB_STEP_SUMMARY
        echo "   \`\`\`gradle" >> $GITHUB_STEP_SUMMARY
        echo "   implementation 'com.github.arunkatherashala:kore-fileformat:${VERSION}'" >> $GITHUB_STEP_SUMMARY
        echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
