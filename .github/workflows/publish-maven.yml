name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Configure Maven for Central Portal
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>central-portal</id>
              <username>${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}</username>
              <password>${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}</password>
            </server>
          </servers>
        </settings>
        EOF
        
        echo "=== Settings.xml configured ==="
        grep -A2 "server" ~/.m2/settings.xml | head -10

    - name: Build and Deploy to Maven Central
      run: |
        cd maven
        mvn clean package -Dmaven.test.skip=true -DskipTests -Dgpg.skip=true --no-transfer-progress
        
        # Deploy to Maven Central using Sonatype Central Portal
        VERSION="1.2.1"
        REPO_URL="https://central.sonatype.com/api/v1/publisher/upload"
        
        echo "=== Deploying to Maven Central via Sonatype Central Portal ==="
        
        mvn deploy:deploy-file \
          -Durl="${REPO_URL}" \
          -DrepositoryId=central-portal \
          -Dfile=target/kore-fileformat-${VERSION}.jar \
          -DpomFile=target/kore-fileformat-${VERSION}.pom \
          -Dsources=target/kore-fileformat-${VERSION}-sources.jar \
          -Djavadoc=target/kore-fileformat-${VERSION}-javadoc.jar \
          -Dgpg.skip=true \
          --no-transfer-progress
        
        echo "=== Deployment complete ==="

    - name: Publish Summary
      if: success()
      run: |
        echo "## ✅ Kore Published to Maven Central" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Package:** com.github.arunkatherashala:kore-fileformat:1.2.1" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** [Maven Central](https://central.sonatype.com/artifact/com/github/arunkatherashala/kore-fileformat)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "⏳ Artifacts available in 10-15 minutes via Maven Central search." >> $GITHUB_STEP_SUMMARY

