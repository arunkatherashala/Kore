name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Configure Maven for Central Portal
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>central-portal</id>
              <username>${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}</username>
              <password>${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}</password>
            </server>
          </servers>
        </settings>
        EOF
        
        echo "=== Settings.xml configured ==="
        grep -A2 "server" ~/.m2/settings.xml | head -10

    - name: Build and Deploy to Maven Central
      run: |
        cd maven
        mvn clean package -Dmaven.test.skip=true -DskipTests -Dgpg.skip=true --no-transfer-progress
        
        # Extract version from pom.xml
        VERSION=$(mvn help:describe -Dexpression=project.version -q -DforceStdout)
        ARTIFACT_ID="kore-fileformat"
        GROUP_ID="io.github.arunkatherashala"
        BUNDLE_DIR="bundle"
        BUNDLE_JAR="${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}-bundle.jar"
        
        echo "=== Creating Maven Bundle ==="
        echo "Version: ${VERSION}"
        echo "GroupId: ${GROUP_ID}"
        echo "ArtifactId: ${ARTIFACT_ID}"
        
        # Create bundle directory structure
        mkdir -p ${BUNDLE_DIR}
        cd ${BUNDLE_DIR}
        
        # Create META-INF/maven structure
        mkdir -p META-INF/maven/${GROUP_ID}/${ARTIFACT_ID}
        
        # Copy files with proper naming
        cp ../target/${ARTIFACT_ID}-${VERSION}.jar .
        cp ../target/${ARTIFACT_ID}-${VERSION}-sources.jar .
        cp ../target/${ARTIFACT_ID}-${VERSION}-javadoc.jar .
        cp ../pom.xml META-INF/maven/${GROUP_ID}/${ARTIFACT_ID}/
        cp ../pom.xml .
        
        # Create the bundle JAR
        jar cvf ${BUNDLE_JAR} ${ARTIFACT_ID}-${VERSION}.jar ${ARTIFACT_ID}-${VERSION}-sources.jar ${ARTIFACT_ID}-${VERSION}-javadoc.jar pom.xml META-INF/
        
        echo "=== Bundle created: ${BUNDLE_JAR} ==="
        
        # Upload bundle to Maven Central
        USERNAME="${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}"
        PASSWORD="${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}"
        API_URL="https://central.sonatype.com/api/v1/publisher/upload"
        
        echo "=== Uploading bundle to Maven Central ==="
        
        curl -v \
          -F "bundle=@${BUNDLE_JAR}" \
          --basic -u "${USERNAME}:${PASSWORD}" \
          "${API_URL}"
        
        echo ""
        echo "=== Upload complete ==="

    - name: Publish Summary
      if: success()
      run: |
        VERSION=$(cd maven && mvn help:describe -Dexpression=project.version -q -DforceStdout)
        echo "## ✅ Kore Published to Maven Central" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Package:** io.github.arunkatherashala:kore-fileformat:${VERSION}" >> $GITHUB_STEP_SUMMARY
        echo "**Java Runtime:** JDK 21 with full Java 21 language features" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** [Maven Central](https://central.sonatype.com/artifact/io.github.arunkatherashala/kore-fileformat)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "⏳ Artifacts available in 10-15 minutes via Maven Central search." >> $GITHUB_STEP_SUMMARY

