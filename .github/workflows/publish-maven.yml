name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Configure Maven for GitHub Packages
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <activeProfiles>
            <activeProfile>github</activeProfile>
          </activeProfiles>
          <profiles>
            <profile>
              <id>github</id>
              <repositories>
                <repository>
                  <id>github</id>
                  <name>GitHub Packages</name>
                  <url>https://maven.pkg.github.com/arunkatherashala/Kore</url>
                  <releases>
                    <enabled>true</enabled>
                  </releases>
                  <snapshots>
                    <enabled>true</enabled>
                  </snapshots>
                </repository>
              </repositories>
            </profile>
          </profiles>
          <servers>
            <server>
              <id>github</id>
              <username>${{ github.actor }}</username>
              <password>${env.GITHUB_TOKEN}</password>
            </server>
          </servers>
        </settings>
        EOF
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build JAR
      run: |
        cd maven
        mvn clean package -DskipTests
    
    - name: Deploy to GitHub Packages
      run: |
        cd maven
        mvn deploy \
          -Dmaven.test.skip=true \
          -DskipTests \
          -Dorg.slf4j.simpleLogger.defaultLogLevel=warn \
          -DrepositoryId=github
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish summary
      run: |
        echo "## Maven Package Published to GitHub Packages" >> $GITHUB_STEP_SUMMARY
        echo "✅ Artifact deployed to: maven.pkg.github.com/arunkatherashala/Kore" >> $GITHUB_STEP_SUMMARY
        echo "Package: io.github.arunkatherashala:kore-fileformat:1.2.1" >> $GITHUB_STEP_SUMMARY
        echo "Access: https://github.com/arunkatherashala/Kore/packages" >> $GITHUB_STEP_SUMMARY




