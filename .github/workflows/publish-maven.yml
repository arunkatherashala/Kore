name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build Maven Artifacts
      run: |
        cd maven
        
        echo "========================================"
        echo "Building Maven artifacts for Central"
        echo "========================================"
        
        # Build all required artifacts
        mvn clean package \
          -DskipTests \
          --no-transfer-progress
        
        echo "✓ Build completed"

    - name: Publish to Maven Central via API
      run: |
        cd maven
        
        # Extract version
        VERSION=$(sed -n '/<version>/p' pom.xml | head -1 | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
        
        echo "========================================"
        echo "Publishing v${VERSION} to Maven Central"
        echo "========================================"
        
        # Create temporary directory for bundle
        BUNDLE_DIR=$(mktemp -d)
        BUNDLE_STAGING="${BUNDLE_DIR}/kore-fileformat-${VERSION}"
        mkdir -p "$BUNDLE_STAGING"
        
        # Copy all artifacts to bundle directory
        cp target/kore-fileformat-${VERSION}.jar "$BUNDLE_STAGING/"
        cp target/kore-fileformat-${VERSION}-sources.jar "$BUNDLE_STAGING/"
        cp target/kore-fileformat-${VERSION}-javadoc.jar "$BUNDLE_STAGING/"
        cp pom.xml "$BUNDLE_STAGING/kore-fileformat-${VERSION}.pom"
        
        echo "Bundle contents:"
        ls -la "$BUNDLE_STAGING"
        
        # Create ZIP bundle with all artifacts in root (Sonatype requirement)
        # Maven Central only accepts: .jar, .pom, -sources.jar, -javadoc.jar, .asc (signatures)
        BUNDLE_ZIP="${BUNDLE_DIR}/bundle.zip"
        cd "$BUNDLE_STAGING"
        # Use -j flag to strip directory prefixes, ensuring all files are in ZIP root
        zip -j "bundle.zip" kore-fileformat-${VERSION}.jar kore-fileformat-${VERSION}.pom kore-fileformat-${VERSION}-sources.jar kore-fileformat-${VERSION}-javadoc.jar
        mv "bundle.zip" "$BUNDLE_ZIP"
        cd - > /dev/null
        
        echo ""
        echo "✓ ZIP bundle created: $BUNDLE_ZIP"
        ls -lh "$BUNDLE_ZIP"
        
        # CRITICAL: Verify ZIP contents structure
        echo ""
        echo "=== ZIP Structure Validation (Sonatype requirement) ==="
        UNZIP_OUTPUT=$(unzip -l "$BUNDLE_ZIP")
        echo "$UNZIP_OUTPUT"
        
        # Verify required files exist in ZIP root (not in subdirectories)
        if ! echo "$UNZIP_OUTPUT" | grep -q "kore-fileformat-${VERSION}.jar"; then
          echo "❌ ERROR: JAR file not in ZIP root!"
          exit 1
        fi
        if ! echo "$UNZIP_OUTPUT" | grep -q "kore-fileformat-${VERSION}.pom"; then
          echo "❌ ERROR: POM file not in ZIP root!"
          exit 1
        fi
        
        echo "✓ Bundle structure validated"
        
        # Publish using Central Portal API
        echo ""
        echo "Uploading bundle to Central Portal..."
        
        curl -v -X POST \
          -u "${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}:${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}" \
          -F "bundle=@${BUNDLE_ZIP}" \
          "https://central.sonatype.com/api/v1/publisher/upload" 2>&1 | tee upload_response.txt
        
        # Check response
        if grep -q "error\|Error\|ERROR\|400\|401\|402\|403\|404" upload_response.txt; then
          echo "❌ Upload may have failed - checking response..."
          cat upload_response.txt
          exit 1
        fi
        
        echo ""
        echo "✓ Published to Maven Central"
        echo "Note: May take 10-15 minutes to appear in search"

    - name: Publish Summary
      if: always()
      run: |
        cd maven
        VERSION=$(sed -n '/<version>/p' pom.xml | head -1 | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
        
        echo "## ✅ Kore v${VERSION} Deployed to Maven Central" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Package:** io.github.arunkatherashala:kore-fileformat:${VERSION}" >> $GITHUB_STEP_SUMMARY
        echo "**Java Runtime:** JDK 21 with full Java 21 language features" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** [Maven Central](https://central.sonatype.com/artifact/io.github.arunkatherashala/kore-fileformat)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "- ⏳ Indexing: 10-15 minutes (check back at [Maven Central Search](https://central.sonatype.com/search?q=kore-fileformat))" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Once indexed, use in Maven: \`io.github.arunkatherashala:kore-fileformat:${VERSION}\`" >> $GITHUB_STEP_SUMMARY

