name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Configure GPG Key
      run: |
        mkdir -p ~/.gnupg
        echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --import --batch --no-tty
        echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
        echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf

    - name: Configure Maven for Central Portal
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>central</id>
              <username></username>
              <password></password>
            </server>
          </servers>
        </settings>
        EOF
        # Use sed to substitute Central Portal credentials
        sed -i 's|<username></username>|<username>'"$CENTRAL_TOKEN"'</username>|g' ~/.m2/settings.xml
        sed -i 's|<password></password>|<password>dummy</password>|g' ~/.m2/settings.xml

    - name: Build and Deploy to Maven Central
      run: |
        cd maven
        mvn -P release clean deploy \
          -Dmaven.test.skip=true \
          -DskipTests \
          -Dgpg.passphrase="${{ secrets.GPG_PASSPHRASE }}" \
          --no-transfer-progress
      env:
        CENTRAL_TOKEN: ${{ secrets.CENTRAL_PORTAL_TOKEN }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    - name: Publish Summary
      run: |
        echo "## ✅ Kore Published to Maven Central" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Package:** com.github.arunkatherashala:kore-fileformat:1.2.1" >> $GITHUB_STEP_SUMMARY
        echo "**Namespace:** com.github.arunkatherashala" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** [Maven Central](https://central.sonatype.com/artifact/com/github/arunkatherashala/kore-fileformat)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Access in 10-15 minutes via Maven Central search or repositories." >> $GITHUB_STEP_SUMMARY
