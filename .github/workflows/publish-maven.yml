name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Configure Maven for Central Portal
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 http://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>central-portal</id>
              <username>${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}</username>
              <password>${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}</password>
            </server>
          </servers>
        </settings>
        EOF
        
        echo "=== Settings.xml configured ==="
        grep -A2 "server" ~/.m2/settings.xml | head -10

    - name: Build and Deploy to Maven Central
      run: |
        cd maven
        
        # Build the project
        mvn clean package -Dmaven.test.skip=true -DskipTests -Dgpg.skip=true --no-transfer-progress
        
        # Extract version - use sed to parse pom.xml
        VERSION=$(sed -n '/<version>/p' pom.xml | head -1 | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
        
        echo "Extracted version: $VERSION"
        if [ -z "$VERSION" ]; then
          echo "ERROR: Could not extract version from pom.xml!"
          cat pom.xml | grep version | head -5
          exit 1
        fi
        
        ARTIFACT_ID="kore-fileformat"
        GROUP_ID="io.github.arunkatherashala"
        BUNDLE_DIR="bundle"
        BUNDLE_JAR="${BUNDLE_DIR}/${ARTIFACT_ID}-${VERSION}-bundle.jar"
        
        echo "Creating bundle..."
        echo "  Version: $VERSION"
        echo "  ArtifactId: $ARTIFACT_ID"
        echo "  Bundle JAR: $BUNDLE_JAR"
        
        # Create bundle directory
        mkdir -p "${BUNDLE_DIR}"
        cd "${BUNDLE_DIR}"
        
        # Create META-INF structure
        mkdir -p "META-INF/maven/${GROUP_ID}/${ARTIFACT_ID}"
        
        # Copy artifacts  
        echo "Copying artifacts..."
        cp "../target/${ARTIFACT_ID}-${VERSION}.jar" . || { echo "ERROR: Missing main JAR"; exit 1; }
        cp "../target/${ARTIFACT_ID}-${VERSION}-sources.jar" . || { echo "ERROR: Missing sources JAR"; exit 1; }
        cp "../target/${ARTIFACT_ID}-${VERSION}-javadoc.jar" . || { echo "ERROR: Missing javadoc JAR"; exit 1; }
        cp "../pom.xml" "META-INF/maven/${GROUP_ID}/${ARTIFACT_ID}/"
        cp "../pom.xml" .
        
        # Create bundle JAR
        echo "Creating bundle JAR..."
        jar cvf "${BUNDLE_JAR}" \
          "${ARTIFACT_ID}-${VERSION}.jar" \
          "${ARTIFACT_ID}-${VERSION}-sources.jar" \
          "${ARTIFACT_ID}-${VERSION}-javadoc.jar" \
          pom.xml \
          META-INF/ || { echo "ERROR: Failed to create bundle"; exit 1; }
        
        echo "Bundle created successfully!"
        ls -lh "${BUNDLE_JAR}"
        
        # Upload to Maven Central
        USERNAME="${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}"
        PASSWORD="${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}"
        API_URL="https://central.sonatype.com/api/v1/publisher/upload"
        
        echo ""
        echo "========================================"
        echo "Uploading to Maven Central"
        echo "========================================"
        echo "Endpoint: ${API_URL}"
        
        # Upload and capture response
        curl -i \
          -F "bundle=@${BUNDLE_JAR}" \
          --basic -u "${USERNAME}:${PASSWORD}" \
          "${API_URL}"
        
        echo ""
        echo "Upload request sent"

    - name: Publish Summary
      if: success()
      run: |
        VERSION=$(cd maven && mvn help:describe -Dexpression=project.version -q -DforceStdout)
        echo "## ✅ Kore Published to Maven Central" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Package:** io.github.arunkatherashala:kore-fileformat:${VERSION}" >> $GITHUB_STEP_SUMMARY
        echo "**Java Runtime:** JDK 21 with full Java 21 language features" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** [Maven Central](https://central.sonatype.com/artifact/io.github.arunkatherashala/kore-fileformat)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "⏳ Artifacts available in 10-15 minutes via Maven Central search." >> $GITHUB_STEP_SUMMARY

