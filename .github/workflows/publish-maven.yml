name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build Maven Artifacts
      run: |
        cd maven
        
        echo "========================================"
        echo "Building Maven artifacts for Central"
        echo "========================================"
        
        # Build all required artifacts
        mvn clean package \
          -DskipTests \
          --no-transfer-progress
        
        echo "✓ Build completed"

    - name: Publish to Maven Central via API
      run: |
        cd maven
        
        # Extract version
        VERSION=$(sed -n '/<version>/p' pom.xml | head -1 | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
        
        echo "========================================"
        echo "Publishing v${VERSION} to Maven Central"
        echo "========================================"
        
        # Create temporary directory for bundle
        BUNDLE_DIR=$(mktemp -d)
        BUNDLE_STAGING="$BUNDLE_DIR"
        cd "$BUNDLE_STAGING"
        
        # Copy all artifacts to bundle directory (ROOT LEVEL - no subdirectories!)
        cp $OLDPWD/target/kore-fileformat-${VERSION}.jar .
        cp $OLDPWD/target/kore-fileformat-${VERSION}-sources.jar .
        cp $OLDPWD/target/kore-fileformat-${VERSION}-javadoc.jar .
        cp $OLDPWD/pom.xml ./kore-fileformat-${VERSION}.pom
        
        echo "Generating MD5 and SHA1 checksums..."
        # Generate MD5 checksums for each file
        md5sum kore-fileformat-${VERSION}.jar > kore-fileformat-${VERSION}.jar.md5
        md5sum kore-fileformat-${VERSION}.pom > kore-fileformat-${VERSION}.pom.md5
        md5sum kore-fileformat-${VERSION}-sources.jar > kore-fileformat-${VERSION}-sources.jar.md5
        md5sum kore-fileformat-${VERSION}-javadoc.jar > kore-fileformat-${VERSION}-javadoc.jar.md5
        
        # Generate SHA1 checksums for each file
        sha1sum kore-fileformat-${VERSION}.jar > kore-fileformat-${VERSION}.jar.sha1
        sha1sum kore-fileformat-${VERSION}.pom > kore-fileformat-${VERSION}.pom.sha1
        sha1sum kore-fileformat-${VERSION}-sources.jar > kore-fileformat-${VERSION}-sources.jar.sha1
        sha1sum kore-fileformat-${VERSION}-javadoc.jar > kore-fileformat-${VERSION}-javadoc.jar.sha1
        
        echo "✓ Checksums generated"
        ls -la | grep -E "\.(jar|pom|md5|sha1)"
        
        # Create ZIP bundle with all artifacts and checksums in root
        BUNDLE_ZIP="${BUNDLE_DIR}/bundle.zip"
        zip -j "$BUNDLE_ZIP" \
          kore-fileformat-${VERSION}.jar \
          kore-fileformat-${VERSION}.jar.md5 \
          kore-fileformat-${VERSION}.jar.sha1 \
          kore-fileformat-${VERSION}.pom \
          kore-fileformat-${VERSION}.pom.md5 \
          kore-fileformat-${VERSION}.pom.sha1 \
          kore-fileformat-${VERSION}-sources.jar \
          kore-fileformat-${VERSION}-sources.jar.md5 \
          kore-fileformat-${VERSION}-sources.jar.sha1 \
          kore-fileformat-${VERSION}-javadoc.jar \
          kore-fileformat-${VERSION}-javadoc.jar.md5 \
          kore-fileformat-${VERSION}-javadoc.jar.sha1
        
        echo ""
        echo "✓ ZIP bundle created: $BUNDLE_ZIP"
        ls -lh "$BUNDLE_ZIP"
        
        # CRITICAL: Verify ZIP contents structure (all files at root, no subdirectories)
        echo ""
        echo "=== ZIP Structure Validation (Sonatype requirement) ==="
        UNZIP_OUTPUT=$(unzip -l "$BUNDLE_ZIP")
        echo "$UNZIP_OUTPUT"
        
        # Verify required files exist at ZIP root (NOT in subdirectories with ./)
        if ! echo "$UNZIP_OUTPUT" | grep -E "^\s+[0-9]+\s+[0-9-]+\s+[0-9:]+\s+kore-fileformat-${VERSION}\.jar$"; then
          echo "❌ ERROR: JAR file not in ZIP root or has wrong path!"
          exit 1
        fi
        if ! echo "$UNZIP_OUTPUT" | grep -E "^\s+[0-9]+\s+[0-9-]+\s+[0-9:]+\s+kore-fileformat-${VERSION}\.pom$"; then
          echo "❌ ERROR: POM file not in ZIP root or has wrong path!"
          exit 1
        fi
        # Count MD5 checksums (should be 4: jar, pom, sources.jar, javadoc.jar)
        MD5_COUNT=$(echo "$UNZIP_OUTPUT" | grep -c "\.md5$")
        if [ "$MD5_COUNT" -lt 4 ]; then
          echo "❌ ERROR: Missing MD5 checksums in ZIP! Found: $MD5_COUNT, Expected: 4"
          exit 1
        fi
        # Count SHA1 checksums (should be 4)
        SHA1_COUNT=$(echo "$UNZIP_OUTPUT" | grep -c "\.sha1$")
        if [ "$SHA1_COUNT" -lt 4 ]; then
          echo "❌ ERROR: Missing SHA1 checksums in ZIP! Found: $SHA1_COUNT, Expected: 4"
          exit 1
        fi
        echo "✓ All required checksums present (MD5: $MD5_COUNT, SHA1: $SHA1_COUNT)"
        
        echo "✓ Bundle structure validated with all required checksums"
        
        # Publish using Central Portal API
        echo ""
        echo "========================================"
        echo "Uploading bundle to Central Portal..."
        echo "========================================"
        echo "Bundle: $BUNDLE_ZIP"
        echo "Files: $(unzip -l "$BUNDLE_ZIP" | grep -c "kore-fileformat")"
        
        curl -v -X POST \
          -u "${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}:${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}" \
          -F "bundle=@${BUNDLE_ZIP}" \
          "https://central.sonatype.com/api/v1/publisher/upload" 2>&1 | tee upload_response.txt
        
        # Check response
        if grep -q "error\|Error\|ERROR\|400\|401\|402\|403\|404" upload_response.txt; then
          echo "❌ Upload may have failed - checking response..."
          cat upload_response.txt
          exit 1
        fi
        
        echo ""
        echo "✓ Published to Maven Central"
        echo "Note: May take 10-15 minutes to appear in search"

    - name: Publish Summary
      if: always()
      run: |
        cd maven
        VERSION=$(sed -n '/<version>/p' pom.xml | head -1 | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
        
        echo "## ✅ Kore v${VERSION} Deployed to Maven Central" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Package:** io.github.arunkatherashala:kore-fileformat:${VERSION}" >> $GITHUB_STEP_SUMMARY
        echo "**Java Runtime:** JDK 21 with full Java 21 language features" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** [Maven Central](https://central.sonatype.com/artifact/io.github.arunkatherashala/kore-fileformat)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "- ⏳ Indexing: 10-15 minutes (check back at [Maven Central Search](https://central.sonatype.com/search?q=kore-fileformat))" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Once indexed, use in Maven: \`io.github.arunkatherashala:kore-fileformat:${VERSION}\`" >> $GITHUB_STEP_SUMMARY

