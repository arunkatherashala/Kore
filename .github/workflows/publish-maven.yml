name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Configure Maven settings with server credentials
      uses: whelk-io/maven-settings-xml-action@v22
      with:
        servers: |
          [
            {
              "id": "ossrh",
              "username": "${{ secrets.MAVEN_USERNAME }}",
              "password": "${{ secrets.MAVEN_PASSWORD }}"
            }
          ]
    
    - name: Check Maven
      run: |
        mvn --version
        ls -la maven/
        echo "=== Testing Sonatype API with curl ==="
        curl -v -u "$MAVEN_USERNAME:$MAVEN_PASSWORD" \
          "https://s01.oss.sonatype.org/service/local/repositories" \
          2>&1 | grep -E "HTTP|WWW-Authenticate|< 200|< 401|< 403"
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
    
    - name: Build JAR
      run: |
        cd maven
        mvn clean package -DskipTests 2>&1 | tail -100
    
    - name: Deploy to Staging
      run: |
        cd maven
        # Try deploying directly with Maven deploy:deploy-file
        JAR_FILE="target/kore-fileformat-1.2.1.jar"
        POM_FILE="pom.xml"
        SOURCES_FILE="target/kore-fileformat-1.2.1-sources.jar"
        JAVADOC_FILE="target/kore-fileformat-1.2.1-javadoc.jar"
        
        # Deploy main JAR with sources and javadoc
        mvn deploy:deploy-file \
          -Durl="https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/" \
          -DrepositoryId=ossrh \
          -Dfile="$JAR_FILE" \
          -DpomFile="$POM_FILE" \
          -Dsources="$SOURCES_FILE" \
          -Djavadoc="$JAVADOC_FILE" \
          -DgeneratePom=false \
          2>&1 | tail -80
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

    - name: Publish summary
      run: |
        echo "## Maven Central Publishing" >> $GITHUB_STEP_SUMMARY
        echo "✅ Artifact deployed to staging repository" >> $GITHUB_STEP_SUMMARY
        echo "Note: Sonatype syncs to Maven Central within 10 minutes" >> $GITHUB_STEP_SUMMARY




