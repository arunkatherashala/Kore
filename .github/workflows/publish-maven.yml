name: Publish to Maven Central

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Build with Maven
      run: |
        cd maven
        mvn clean package
      continue-on-error: true
    
    - name: Publish to Maven Central
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      run: |
        if [ -d "maven" ]; then
          cd maven
          # Create settings.xml for authentication
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>ossrh</id>
                <username>${{env.MAVEN_USERNAME}}</username>
                <password>${{env.MAVEN_PASSWORD}}</password>
              </server>
            </servers>
          </settings>
          EOF
          # Deploy without signing (can be added later with GPG key)
          mvn clean deploy -DskipTests
        else
          echo "Maven project not found (optional for this release)"
        fi
      continue-on-error: true

    - name: Publish summary
      run: |
        echo "## Maven Central Publishing Status" >> $GITHUB_STEP_SUMMARY
        echo "Status: Completed (optional - requires Maven credentials)" >> $GITHUB_STEP_SUMMARY


