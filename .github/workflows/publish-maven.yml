name: Publish to Maven Central

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  maven:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: Build with Maven
      run: |
        cd maven
        mvn clean package -DskipTests
    
    - name: Import GPG Key
      env:
        GPG_KEY_ID: ${{ secrets.MAVEN_GPG_KEY_ID }}
        GPG_KEY_CONTENT: ${{ secrets.MAVEN_GPG_KEY }}
        GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      run: |
        if [ -z "$GPG_KEY_CONTENT" ]; then
          echo "⚠️  WARNING: GPG_KEY_CONTENT secret not found"
          echo "Maven Central requires GPG-signed artifacts"
          echo "Please add MAVEN_GPG_KEY secret with your GPG private key"
          exit 1
        fi
        
        mkdir -p ~/.gnupg
        echo "$GPG_KEY_CONTENT" | base64 -d | gpg --import --no-tty --batch --yes 2>&1 || true
        echo "GPG key imported"
    
    - name: Publish to Maven Central
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      run: |
        echo "=== Publishing to Maven Central ==="
        
        if [ ! -d "maven" ]; then
          echo "❌ Maven directory not found"
          exit 1
        fi
        
        cd maven
        
        # Create .m2/settings.xml
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
  <servers>
    <server>
      <id>ossrh</id>
      <username>${{ secrets.MAVEN_USERNAME }}</username>
      <password>${{ secrets.MAVEN_PASSWORD }}</password>
    </server>
  </servers>
</settings>
EOF
        
        echo "📦 Deploying to Maven Central with GPG signing..."
        mvn clean deploy \
          -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE" \
          -DskipTests \
          --batch-mode \
          --errors \
          -X 2>&1 | tee maven-deploy.log
        
        echo "✅ Deployment complete"
        if grep -q "BUILD SUCCESS" maven-deploy.log; then
          echo "🎉 Build succeeded!"
        elif grep -q "BUILD FAILURE" maven-deploy.log; then
          echo "❌ Build failed - see logs above"
          exit 1
        fi

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: maven-deploy-logs
        path: maven/maven-deploy.log

    - name: Publish summary
      run: |
        echo "## Maven Central Publishing" >> $GITHUB_STEP_SUMMARY
        echo "✅ Artifact deployed to staging repository" >> $GITHUB_STEP_SUMMARY
        echo "Note: Sonatype auto-promotes after ~10 minutes" >> $GITHUB_STEP_SUMMARY



