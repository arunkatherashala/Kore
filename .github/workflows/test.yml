name: Tests

on:
  push:
    branches: [ main, develop, develop-v1.1.6 ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    
    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
    
    - name: Run tests
      run: cargo test --release --verbose
    
    - name: Run integration tests
      run: cargo test --release --test '*' --verbose
    
    - name: Build release
      run: cargo build --release
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: target/release/

  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip maturin pytest
    
    - name: Build Python bindings
      run: |
        maturin develop --release
    
    - name: Test Python bindings
      run: |
        python -c "from kore_fileformat import PerformanceMonitor; print('✅ Python ${{ matrix.python-version }} bindings work')"
        python -c "from kore_fileformat import KoreReader; print('✅ Python ${{ matrix.python-version }} KoreReader works')"
        python -c "from kore_fileformat import KoreWriter; print('✅ Python ${{ matrix.python-version }} KoreWriter works')"