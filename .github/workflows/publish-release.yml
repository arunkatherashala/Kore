name: Create GitHub Release

on:
  # Manual only. Started by "Auto Version Bump & Deploy" (itself manual) on the new v* tag,
  # or by hand on a v* tag. No push/tag/release triggers: a pushed tag alone never publishes.
  # Every publishing job needs the guard job (v* tag + green CI) and runs in the "release"
  # environment (add required reviewers and the registry secrets there in GitHub settings).
  workflow_dispatch:

jobs:
  guard:
    name: "Release guard: v* tag and green CI"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a v* tag whose commit passed the full CI gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          HOLD: ${{ vars.RELEASE_HOLD }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          if [ "$HOLD" = "true" ]; then
            fail "Publishing is on hold: repository variable RELEASE_HOLD is 'true' (Settings -> Secrets and variables -> Actions -> Variables). Set it to false or delete it, then re-run."
          fi
          case "$REF" in refs/tags/v*) ;; *) fail "publish only runs on a v* tag (got $REF)";; esac
          # any successful push run of ci.yml for the SHA counts (a promoted commit may also have a newer run on stable)
          ci() { gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$1&event=push&per_page=100" --jq 'if any(.workflow_runs[]; .conclusion == "success") then "success" else (.workflow_runs[0].conclusion // .workflow_runs[0].status // "none") end'; }
          C="$(ci "$SHA")"
          echo "CI for tag commit $SHA: $C"
          if [ "$C" != "success" ]; then
            # The release workflow tags its own version-bump commit ([skip ci]); then the commit it bumped must be green.
            MSG="$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message' | head -1)"
            WHO="$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.committer.name')"
            NPAR="$(gh api "repos/$REPO/commits/$SHA" --jq '.parents | length')"
            case "$MSG" in "chore: auto-bump "*) ;; *) fail "tag commit has no successful CI run and is not a version-bump commit";; esac
            [ "$WHO" = "github-actions[bot]" ] && [ "$NPAR" = "1" ] || fail "version-bump commit not made by the release workflow"
            ALLOWED=" pyproject.toml kore-python/kore_fileformat.py kore-python/README.md kore-node/package.json kore-node/README.md kore-ruby/kore_fileformat.gemspec kore-ruby/README.md kore-go/go.mod kore-go/README.md kore-php/composer.json kore-php/README.md maven/README.md maven/pom.xml csharp/Kore.FileFormat/README.md csharp/Kore.FileFormat/Kore.FileFormat.csproj kore-standalone/Cargo.toml kore-standalone/README.md "
            for f in $(gh api "repos/$REPO/commits/$SHA" --jq '.files[].filename'); do
              case "$ALLOWED" in *" $f "*) ;; *) fail "version-bump commit also changes $f";; esac
            done
            PARENT="$(gh api "repos/$REPO/commits/$SHA" --jq '.parents[0].sha')"
            C="$(ci "$PARENT")"
            echo "CI for bumped commit $PARENT: $C"
          fi
          [ "$C" = "success" ] || fail "CI has not passed (conclusion: $C); not publishing"

  release:
    needs: guard
    environment: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Python wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build --outdir dist/

      - name: Build Java jars (core + single all-in-one)
        working-directory: maven
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B clean package -DskipTests -Dgpg.skip=true
          mkdir -p ../dist
          cp "target/kore-fileformat-${VERSION}.jar" \
             "target/kore-fileformat-${VERSION}-all.jar" \
             "target/kore-fileformat-${VERSION}-sources.jar" ../dist/
          ls -lh ../dist

      - name: Generate changelog
        id: changelog
        # Release notes = the commits since the previous v* tag, without the bot's own commits
        # (version bumps, merge-backs). This is the only place that creates the GitHub Release
        # for a tag dispatched by "Auto Version Bump & Deploy".
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          PREVIOUS_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${CURRENT_TAG}^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            RANGE="${PREVIOUS_TAG}..${CURRENT_TAG}"
            LIMIT=1000
          else
            RANGE="$CURRENT_TAG"   # first release: the 50 newest commits
            LIMIT=50
          fi
          CHANGELOG="$(git log --format='%an%x09- %s (%h)' "$RANGE" \
            | awk -F'\t' -v limit="$LIMIT" '$1 != "github-actions[bot]" && n < limit { sub(/^[^\t]*\t/, ""); print; n++ }')"
          COMMIT_COUNT="$(printf '%s' "$CHANGELOG" | grep -c '^- ' || true)"
          [ -n "$CHANGELOG" ] || CHANGELOG="- (no changes besides the version bump)"
          echo "Release notes for $CURRENT_TAG (since ${PREVIOUS_TAG:-the beginning}):"
          echo "$CHANGELOG"

          # Store changelog in output (random delimiter: a commit subject cannot end the block)
          DELIM="CHANGELOG_$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "CHANGELOG<<$DELIM"
            echo "$CHANGELOG"
            echo "$DELIM"
            echo "COMMIT_COUNT=$COMMIT_COUNT"
            echo "PREVIOUS_TAG=$PREVIOUS_TAG"
            echo "VERSION=${CURRENT_TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: dist/*
          body: |
            ## Changelog
            
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ---
            
            **Commits since ${{ steps.changelog.outputs.PREVIOUS_TAG || 'the first commit' }} (bot commits excluded):** ${{ steps.changelog.outputs.COMMIT_COUNT }}
            
            ## Direct download (no PyPI / Maven needed)
            Python wheel — download from Assets below, or install straight from this release:
            ```bash
            pip install https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/kore_fileformat-${{ steps.changelog.outputs.VERSION }}-py3-none-any.whl
            ```
            Java — download `kore-fileformat-${{ steps.changelog.outputs.VERSION }}-all.jar` (one file, all dependencies included) and add it to your classpath / IDE / `lib/` folder.
            
            ## What's Included
            - **Python Package:** Published to PyPI as `kore-fileformat`
            - **Java Library:** Deployed to Maven Central
            - **JavaScript Package:** Published to npm as `kore-fileformat`
            - **Rust Crate:** Published to crates.io as `kore_fileformat`
            - **Docker Image:** Published to GHCR as `ghcr.io/arunkatherashala/kore:latest`
            
            ## ðŸ“š Documentation
            - [PyPI Page](https://pypi.org/project/kore-fileformat/)
            - [Maven Central](https://mvnrepository.com/artifact/com.arunkatherashala/kore-fileformat)
            - [npm Package](https://www.npmjs.com/package/kore-fileformat)
            - [Crates.io](https://crates.io/crates/kore_fileformat)
            - [GitHub Container Registry](https://github.com/arunkatherashala/Kore/pkgs/container/kore)
            
            ## ðŸ”— Links
            - [View on GitHub](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }})
            - [Compare with previous](https://github.com/${{ github.repository }}/compare/${{ steps.changelog.outputs.PREVIOUS_TAG || format('{0}^', github.ref_name) }}...${{ github.ref_name }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


