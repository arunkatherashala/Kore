name: Publish R Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  check-and-build:
    name: R CMD check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        run: |
          install.packages(c("rcmdcheck", "testthat", "devtools"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Run R CMD check
        run: rcmdcheck::rcmdcheck("kore-fileformat-r", args = c("--no-manual", "--as-cran"), error_on = "error")
        shell: Rscript {0}

      - name: Build CRAN tarball
        run: devtools::build("kore-fileformat-r", binary = FALSE, quiet = FALSE)
        shell: Rscript {0}

      - name: Upload CRAN-ready tarball
        uses: actions/upload-artifact@v4
        with:
          name: korefileformat-cran
          path: "*.tar.gz"
          retention-days: 30

      - name: CRAN submission info
        run: |
          echo "============================================"
          echo "Package built. To submit to CRAN:"
          echo "  https://cran.r-project.org/submit.html"
          echo "Or locally: devtools::submit_cran()"
          echo "============================================"
