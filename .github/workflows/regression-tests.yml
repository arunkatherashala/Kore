name: Multi-Platform Regression Tests

on:
  push:
    branches: [ main, develop-v1.1.6 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, develop-v1.1.6 ]
  workflow_dispatch:

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run Python tests
        run: |
          pytest tests/ -v --tb=short --cov=kore_fileformat
      
      - name: Test package installation from PyPI
        run: |
          pip install kore-fileformat
          python -c "from kore_fileformat import compress; print('✅ PyPI package works')"
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: false

  dotnet-tests:
    name: .NET Regression Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      
      - name: Restore dependencies
        working-directory: kore-fileformat-nuget
        run: dotnet restore
      
      - name: Build
        working-directory: kore-fileformat-nuget
        run: dotnet build --configuration Release --no-restore
      
      - name: Run tests
        working-directory: kore-fileformat-nuget
        run: dotnet test --configuration Release --no-build --verbosity normal
      
      - name: Test package installation from NuGet
        run: |
          dotnet new console -n TestKore -f net6.0
          cd TestKore
          dotnet add package kore-fileformat
          dotnet build
          echo "✅ NuGet package works"

  ruby-tests:
    name: Ruby Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: kore-fileformat-ruby
      
      - name: Run RSpec tests
        working-directory: kore-fileformat-ruby
        run: bundle exec rspec spec/ -v
        continue-on-error: true
      
      - name: Test gem installation
        run: |
          gem install kore-fileformat
          ruby -e "require 'kore_fileformat'; puts '✅ RubyGems package works'"
        continue-on-error: true

  nodejs-tests:
    name: Node.js Regression Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run tests
        run: npm test -- --no-coverage
      
      - name: Test npm package installation
        run: |
          npm install kore-fileformat
          node -e "require('kore-fileformat'); console.log('✅ npm package works')"

  rust-tests:
    name: Rust Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run Rust tests
        run: cargo test --release --verbose
      
      - name: Verify documentation builds
        run: cargo doc --no-deps --verbose

  java-tests:
    name: Java Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Run Maven tests
        run: mvn clean verify
      
      - name: Verify JAR builds correctly
        run: mvn package -DskipTests

  integration-test:
    name: Cross-Platform Installation Test
    runs-on: ubuntu-latest
    needs: [python-tests, nodejs-tests, rust-tests]
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Python installation test
        run: |
          pip install kore-fileformat
          python -c "
          from kore_fileformat import compress
          print('✅ Python: kore-fileformat imported successfully')
          "
      
      - name: Node.js installation test
        run: |
          npm install kore-fileformat
          node -e "
          const kore = require('kore-fileformat');
          console.log('✅ Node.js: kore-fileformat imported successfully');
          "
      
      - name: Rust installation test
        run: |
          cargo fetch --manifest-path Cargo.toml
          echo "✅ Rust: kore_fileformat crate fetched successfully"

  test-summary:
    name: Regression Test Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [python-tests, dotnet-tests, ruby-tests, nodejs-tests, rust-tests, java-tests, integration-test]
    steps:
      - name: Check test results
        run: |
          echo "## Multi-Platform Regression Test Results 📊" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python | ${{ needs.python-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| .NET | ${{ needs.dotnet-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Ruby | ${{ needs.ruby-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js | ${{ needs.nodejs-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust | ${{ needs.rust-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Java | ${{ needs.java-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration | ${{ needs.integration-test.result }} |" >> $GITHUB_STEP_SUMMARY
      
      - name: Fail if any tests failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
