name: Publish to NuGet

on:
  # Manual only. Started by "Auto Version Bump & Deploy" (itself manual) on the new v* tag,
  # or by hand on a v* tag. No push/tag/release triggers: a pushed tag alone never publishes.
  # Every publishing job needs the guard job (v* tag + green CI) and runs in the "release"
  # environment (add required reviewers and the registry secrets there in GitHub settings).
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    name: "Release guard: v* tag and green CI"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a v* tag whose commit passed the full CI gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$REF" in refs/tags/v*) ;; *) fail "publish only runs on a v* tag (got $REF)";; esac
          ci() { gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$1&event=push&per_page=1" --jq '.workflow_runs[0].conclusion // "none"'; }
          C="$(ci "$SHA")"
          echo "CI for tag commit $SHA: $C"
          if [ "$C" != "success" ]; then
            # The release workflow tags its own version-bump commit ([skip ci]); then the commit it bumped must be green.
            MSG="$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message' | head -1)"
            WHO="$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.committer.name')"
            NPAR="$(gh api "repos/$REPO/commits/$SHA" --jq '.parents | length')"
            case "$MSG" in "chore: auto-bump "*) ;; *) fail "tag commit has no successful CI run and is not a version-bump commit";; esac
            [ "$WHO" = "github-actions[bot]" ] && [ "$NPAR" = "1" ] || fail "version-bump commit not made by the release workflow"
            ALLOWED=" pyproject.toml kore-python/kore_fileformat.py kore-python/README.md kore-node/package.json kore-node/README.md kore-ruby/kore_fileformat.gemspec kore-ruby/README.md kore-go/go.mod kore-go/README.md kore-php/composer.json kore-php/README.md maven/README.md maven/pom.xml csharp/Kore.FileFormat/README.md csharp/Kore.FileFormat/Kore.FileFormat.csproj kore-standalone/Cargo.toml kore-standalone/README.md "
            for f in $(gh api "repos/$REPO/commits/$SHA" --jq '.files[].filename'); do
              case "$ALLOWED" in *" $f "*) ;; *) fail "version-bump commit also changes $f";; esac
            done
            PARENT="$(gh api "repos/$REPO/commits/$SHA" --jq '.parents[0].sha')"
            C="$(ci "$PARENT")"
            echo "CI for bumped commit $PARENT: $C"
          fi
          [ "$C" = "success" ] || fail "CI has not passed (conclusion: $C); not publishing"

  nuget:
    needs: guard
    environment: release
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Extract version
      id: version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    
    - name: Find C# project
      id: find-project
      run: |
        PROJECT_PATH="csharp/Kore.FileFormat/Kore.FileFormat.csproj"
        if [ ! -f "$PROJECT_PATH" ]; then
          echo "error=C# project not found at $PROJECT_PATH"
          exit 1
        fi
        echo "project_path=$PROJECT_PATH" >> $GITHUB_OUTPUT
        echo "Found project at: $PROJECT_PATH"
    
    - name: Restore dependencies
      run: dotnet restore "${{ steps.find-project.outputs.project_path }}"
    
    - name: Build NuGet package
      run: |
        dotnet pack "${{ steps.find-project.outputs.project_path }}" \
          --configuration Release \
          --output nupkg

    - name: Publish to NuGet (Trusted Publishing)
      run: |
        for file in nupkg/*.nupkg; do
          echo "Publishing: $file"
          dotnet nuget push "$file" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate || true
        done

    - name: Publish summary
      run: |
        echo "## NuGet Publishing Status" >> $GITHUB_STEP_SUMMARY
        echo "Version: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "Packages published via Trusted Publishing (OIDC)" >> $GITHUB_STEP_SUMMARY
        echo "Status: Completed (optional - requires .NET project structure)" >> $GITHUB_STEP_SUMMARY


