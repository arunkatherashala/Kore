name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build maturin wheel (PyO3) and publish
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            target: x86_64
          - os: macos-latest
            python-version: "3.12"
            target: x86_64
          - os: windows-latest
            python-version: "3.12"
            target: x86_64

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install maturin
      run: pip install maturin twine

    - name: Build wheels with maturin
      run: maturin build --release
      working-directory: ./kore-python

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_AUG }}
      run: |
        twine check kore-python/target/wheels/*
        twine upload kore-python/target/wheels/*
