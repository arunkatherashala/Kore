name: Auto Version Bump & Deploy

# Release only after the full CI quality gate has passed for the pushed commit.
# Flow: push to fileformat -> "KORE CI — Format Quality Gate" runs -> only if every
# CI job succeeded does this workflow bump the version, tag it and trigger the
# publish workflows (PyPI, crates.io, npm, Maven, NuGet, RubyGems, GitHub Release).
# If CI fails or is cancelled, nothing is published.
on:
  workflow_run:
    workflows: ["KORE CI — Format Quality Gate"]
    types: [completed]
    branches: [fileformat]

permissions:
  contents: write
  actions: write

jobs:
  auto-bump-deploy:
    runs-on: ubuntu-latest
    # Gate: CI must have succeeded, for a push (not a pull request), and the push
    # must not be the bot's own version bump (that commit carries [skip ci] anyway).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'fileformat' &&
      github.event.workflow_run.actor.login != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fileformat
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Release only the commit CI tested
        id: same
        run: |
          TESTED="${{ github.event.workflow_run.head_sha }}"
          HEAD_NOW="$(git rev-parse HEAD)"
          if [ "$HEAD_NOW" != "$TESTED" ]; then
            echo "fileformat moved on ($HEAD_NOW) since CI tested $TESTED; the newer push gets its own CI run. Not releasing."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read and bump patch version
        if: steps.same.outputs.go == 'true'
        id: bump
        run: |
          CURRENT=$(grep '^version' pyproject.toml | head -1 | grep -oP '[0-9]+\.[0-9]+\.[0-9]+')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "new=$NEW" >> $GITHUB_OUTPUT
          echo "Bumping: $CURRENT → $NEW"

      - name: Update version in all language files
        if: steps.same.outputs.go == 'true'
        run: |
          OLD="${{ steps.bump.outputs.current }}"
          NEW="${{ steps.bump.outputs.new }}"
          FILES=(
            "pyproject.toml"
            "kore-python/kore_fileformat.py"
            "kore-python/README.md"
            "kore-node/package.json"
            "kore-node/README.md"
            "kore-ruby/kore_fileformat.gemspec"
            "kore-ruby/README.md"
            "kore-go/go.mod"
            "kore-go/README.md"
            "kore-php/composer.json"
            "kore-php/README.md"
            "maven/README.md"
            "csharp/Kore.FileFormat/README.md"
            "kore-standalone/Cargo.toml"
            "kore-standalone/README.md"
          )
          for f in "${FILES[@]}"; do
            [ -f "$f" ] && sed -i "s/$OLD/$NEW/g" "$f"
          done
          # C# has x.x.x.x pattern
          sed -i "s/${OLD}\.0/${NEW}.0/g; s/$OLD/$NEW/g" "csharp/Kore.FileFormat/Kore.FileFormat.csproj"
          # Set (not replace) the package version, since these drifted from pyproject.toml
          sed -i -E "0,/<version>[^<]+<\/version>/s//<version>${NEW}<\/version>/" "maven/pom.xml"
          sed -i -E "0,/\"version\": *\"[^\"]+\"/s//\"version\": \"${NEW}\"/" "kore-node/package.json"
          sed -i -E "0,/^version *= *\"[^\"]+\"/s//version     = \"${NEW}\"/" "kore-standalone/Cargo.toml"

      - name: Commit version bump
        if: steps.same.outputs.go == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: auto-bump ${{ steps.bump.outputs.current }} → ${{ steps.bump.outputs.new }} [skip ci]"
          git push origin fileformat

      - name: Tag and trigger all registry deploys
        if: steps.same.outputs.go == 'true'
        env:
          # PAT needed: GITHUB_TOKEN cannot trigger other workflows (GitHub security design).
          # Create PAT at https://github.com/settings/tokens with repo scope, add as DEPLOY_PAT secret.
          GH_TOKEN: ${{ secrets.DEPLOY_PAT || secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.bump.outputs.new }}"
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "✅ $VERSION tagged"

          # Trigger publish workflows via GitHub API (works with PAT, not GITHUB_TOKEN)
          for WF in publish-release.yml publish-pypi.yml publish-nodejs.yml publish-crates.yml publish-rubygems.yml publish-maven.yml publish-nuget.yml; do
            echo "Triggering $WF for $VERSION..."
            gh workflow run "$WF" --ref "$VERSION" 2>/dev/null || \
            curl -s -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/$WF/dispatches" \
              -d "{\"ref\":\"$VERSION\"}" | head -1 || true
          done
          echo "✅ All publish workflows triggered for $VERSION"
