name: Publish to Docker Hub

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  docker-hub:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Extract version
      id: version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
        fi
    
    - name: Build and push to Docker Hub
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          saiarunkumar/kore:latest
          ${{ (startsWith(github.ref, 'refs/tags/') && format('saiarunkumar/kore:{0}', steps.version.outputs.version)) || '' }}
        cache-from: type=registry,ref=saiarunkumar/kore:buildcache
        cache-to: type=registry,ref=saiarunkumar/kore:buildcache,mode=max
