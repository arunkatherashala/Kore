name: KORE v1.0.0 - COMPLETE CI/CD DEPLOYMENT

on:
  # Manual only. Started by "Auto Version Bump & Deploy" (itself manual) on the new v* tag,
  # or by hand on a v* tag. No push/tag/release triggers: a pushed tag alone never publishes.
  # Every publishing job needs the guard job (v* tag + green CI) and runs in the "release"
  # environment (add required reviewers and the registry secrets there in GitHub settings).
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  guard:
    name: "Release guard: v* tag and green CI"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a v* tag whose commit passed the full CI gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$REF" in refs/tags/v*) ;; *) fail "publish only runs on a v* tag (got $REF)";; esac
          ci() { gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$1&event=push&per_page=1" --jq '.workflow_runs[0].conclusion // "none"'; }
          C="$(ci "$SHA")"
          echo "CI for tag commit $SHA: $C"
          if [ "$C" != "success" ]; then
            # The release workflow tags its own version-bump commit ([skip ci]); then the commit it bumped must be green.
            MSG="$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.message' | head -1)"
            WHO="$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.committer.name')"
            NPAR="$(gh api "repos/$REPO/commits/$SHA" --jq '.parents | length')"
            case "$MSG" in "chore: auto-bump "*) ;; *) fail "tag commit has no successful CI run and is not a version-bump commit";; esac
            [ "$WHO" = "github-actions[bot]" ] && [ "$NPAR" = "1" ] || fail "version-bump commit not made by the release workflow"
            ALLOWED=" pyproject.toml kore-python/kore_fileformat.py kore-python/README.md kore-node/package.json kore-node/README.md kore-ruby/kore_fileformat.gemspec kore-ruby/README.md kore-go/go.mod kore-go/README.md kore-php/composer.json kore-php/README.md maven/README.md maven/pom.xml csharp/Kore.FileFormat/README.md csharp/Kore.FileFormat/Kore.FileFormat.csproj kore-standalone/Cargo.toml kore-standalone/README.md "
            for f in $(gh api "repos/$REPO/commits/$SHA" --jq '.files[].filename'); do
              case "$ALLOWED" in *" $f "*) ;; *) fail "version-bump commit also changes $f";; esac
            done
            PARENT="$(gh api "repos/$REPO/commits/$SHA" --jq '.parents[0].sha')"
            C="$(ci "$PARENT")"
            echo "CI for bumped commit $PARENT: $C"
          fi
          [ "$C" = "success" ] || fail "CI has not passed (conclusion: $C); not publishing"

  # Stage 1: Build & Test
  build:
    needs: guard
    name: Build All Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Build Python packages
        run: |
          python -m pip install build
          python -m build
      
      - name: Build Node.js bindings
        run: |
          cd nodejs
          npm ci
          npm run build
      
      - name: Build Java packages
        run: |
          cd hadoop
          mvn clean package
        continue-on-error: true
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            nodejs/lib/
            hadoop/target/

  # Stage 2: Parallel Publishing
  publish-pypi:
    environment: release
    name: Publish to PyPI
    needs: [guard, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - run: python -m build
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: python -m twine upload dist/* --skip-existing || true

  publish-npm:
    environment: release
    name: Publish to npm
    needs: [guard, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'
      - run: cd nodejs && npm ci
      - run: cd nodejs && npm run build
      - run: cd nodejs && npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-maven:
    environment: release
    name: Publish to Maven Central
    needs: [guard, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: |
          cd hadoop
          mvn clean deploy -P release
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  publish-docker:
    environment: release
    name: Publish to Docker Hub
    needs: [guard, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kore:latest
            ${{ secrets.DOCKER_USERNAME }}/kore:${{ steps.version.outputs.version }}

  publish-nuget:
    environment: release
    name: Publish to NuGet
    needs: [guard, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet pack --configuration Release --output nupkg
      - run: |
          dotnet nuget push nupkg/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate || true

  publish-rubygems:
    environment: release
    name: Publish to RubyGems
    needs: [guard, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: |
          if [ -f kore-fileformat.gemspec ]; then
            gem build kore-fileformat.gemspec
            gem push *.gem --key ${{ secrets.RUBYGEMS_API_KEY }} || true
          fi

  # Stage 3: Summary & Notifications
  summary:
    name: Deployment Summary
    needs: [guard, publish-pypi, publish-npm, publish-maven, publish-docker, publish-nuget, publish-rubygems]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Create deployment summary
        run: |
          echo "# KORE v1.0.0 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Publishing Status" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| PyPI | ${{ needs.publish-pypi.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm | ${{ needs.publish-npm.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Maven Central | ${{ needs.publish-maven.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Hub | ${{ needs.publish-docker.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| NuGet | ${{ needs.publish-nuget.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| RubyGems | ${{ needs.publish-rubygems.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Release Info" >> $GITHUB_STEP_SUMMARY
          echo "Tag: ${GITHUB_REF#refs/tags/}" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${GITHUB_SHA:0:7}" >> $GITHUB_STEP_SUMMARY


