name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Publish core layer first
          - package: kore-core
          
          # Then SQL layer
          - package: kore-sql
          
          # Then compute/join layers
          - package: kore-join
          - package: kore-window
          - package: kore-vectorized
          - package: kore-simd
          - package: kore-jit
          
          # Storage layers
          - package: kore-store
          - package: kore-spill
          - package: kore-object-store
          - package: kore-parquet
          - package: kore-io
          
          # Shuffle and distribution
          - package: kore-shuffle
          - package: kore-delta
          - package: kore-compress
          - package: kore-bloom
          
          # Network/coordination
          - package: kore-net
          - package: kore-coord
          - package: kore-worker
          - package: kore-fault
          - package: kore-distributed
          
          # Advanced features
          - package: kore-arrow
          - package: kore-metrics
          - package: kore-catalog
          - package: kore-catalyst
          
          # Additional layers
          - package: kore-mlx
          - package: kore-kafka
          - package: kore-node
          - package: kore-python
          - package: kore-ffi
          - package: kore-tpch
          - package: kore-bench
          - package: kore-mcp
          - package: kore-gpu
          - package: kore-parallel
          
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Publish ${{ matrix.package }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          cd kore
          cargo publish -p ${{ matrix.package }} --allow-dirty --token ${{ env.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true
      
      - name: Wait for crates.io index sync
        run: sleep 5
  
  verify:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Verify crates published
        run: |
          VERSION=$(cat kore/VERSION)
          echo "Checking crates.io for v$VERSION..."
          
          # Check core package as reference
          curl -s "https://crates.io/api/v1/crates/kore-core" | grep -q "\"max_version\":\"$VERSION\"" && echo "✅ kore-core v$VERSION published"
          
          # Check a few other critical packages
          curl -s "https://crates.io/api/v1/crates/kore-sql" | grep -q "\"max_version\":\"$VERSION\"" && echo "✅ kore-sql v$VERSION published"
          curl -s "https://crates.io/api/v1/crates/kore-python" | grep -q "\"max_version\":\"$VERSION\"" && echo "✅ kore-python v$VERSION published"
