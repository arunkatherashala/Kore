name: KORE CI -- Build, Test, Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build all crates
        run: cargo build --workspace --exclude kore-self

  test:
    name: Unit Tests (245+)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run all unit tests
        run: cargo test --workspace --exclude kore-self

  sql-tests:
    name: SQL Engine Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: kore-sql unit tests
        run: cargo test -p kore-sql

  benchmark:
    name: TPC-H Benchmark
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --release -p kore-tpch
      - name: Run TPC-H Q1-Q22
        run: ./target/release/kore-tpch
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tpch-results
          path: kore_tpch_results.json

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (warnings allowed)
        run: cargo clippy --workspace --exclude kore-self -- -W clippy::all
        continue-on-error: true
