[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["kore_fileformat"]
package-dir = {"" = "kore-python"}

[project]
name = "kore-fileformat"
version = "1.7.11"
description = "KORE Binary Format - High-performance columnar compression with 5-8x compression ratio"
readme = "kore-python/README.md"
requires-python = ">=3.9"
authors = [
  { name = "Sai Arun Kumar Ktherashala", email = "arunkatherashala@gmail.com" }
]
keywords = ["compression", "binary-format", "performance", "serialization", "data-compression", "columnar"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/arunkatherashala/Kore"
Repository = "https://github.com/arunkatherashala/Kore"
Issues = "https://github.com/arunkatherashala/Kore/issues"

[project.scripts]
kore = "kore_fileformat:_cli_main"
