[package]
name = "kore-sdks"
version = "2.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tonic = "0.9"
prost = "0.11"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Code generation
askama = "0.12"
inflector = "0.11"

# Language-specific SDKs
pyo3 = { version = "0.18", optional = true }
jni = { version = "0.21", optional = true }

[features]
default = ["proto_gen"]
proto_gen = []
python_sdk = ["pyo3"]
java_sdk = ["jni"]

[[bin]]
name = "codegen"
path = "src/codegen.rs"
