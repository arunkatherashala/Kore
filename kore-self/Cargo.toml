[package]
name    = "kore-self"
version = "0.3.0"
edition = "2021"
authors = ["Sai Arun Kumar Katherashala"]
description = "A Living AI Twin — powered by KORE SQL. Built by Sai Arun Kumar Katherashala."

[[bin]]
name = "kore-self"
path = "src/main.rs"

[dependencies]
kore-core        = { workspace = true }
kore-sql         = { workspace = true }
kore-store       = { path = "../kore-store" }
kore-delta       = { path = "../kore-delta" }
kore-distributed = { path = "../kore-distributed" }
kore-io          = { path = "../kore-io" }
kore-parquet     = { path = "../kore-parquet" }
kore-body        = { workspace = true }
kore-federation  = { workspace = true }
kore-mesh        = { workspace = true }
kore-survival    = { workspace = true }
tokio            = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
rayon            = { workspace = true }
reqwest          = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url              = "2"
